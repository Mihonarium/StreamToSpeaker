[package]
name = "stream-to-speaker"
version = "0.7.0"
edition = "2021"
rust-version = "1.74"
description = "Stream To Speaker — user-mode bridge between a Windows virtual audio driver (or WASAPI loopback) and any UPnP/OpenHome network speaker (Sonos, IKEA StreamToSpeaker, etc)."
license = "MIT"

[lib]
# Internal Rust crate name retained for code stability — the user-facing
# product name lives in PRODUCT_NAME in src/lib.rs.
name = "stream_to_speaker"
path = "src/lib.rs"

[[bin]]
name = "stream-to-speaker"
path = "src/main.rs"

[dependencies]
# Rust port of Apple's open-source ALAC encoder (Apache-2.0/MIT). Every
# field-proven RAOP sender ships real compressed ALAC; the uncompressed
# escape is unproven on current Sonos firmware.
alac-encoder = "0.3"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
tiny_http = "0.12"
quick-xml = "0.36"
roxmltree = "0.20"
socket2 = { version = "0.5", features = ["all"] }
byteorder = "1"
url = "2"
percent-encoding = "2"
# Persisted user preferences live in %APPDATA%\StreamToSpeaker\config.json
# (last selected speaker, onboarding dismissal). Tiny surface, serde is
# the obvious fit.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AirPlay support.
#
# mDNS-sd: pure-Rust mDNS browser for `_raop._tcp` / `_airplay._tcp`
# discovery. Avoids the system Bonjour dep (mDNSResponder is not present
# on stock Windows, and we don't want to ship the Apple installer).
mdns-sd = { version = "0.13", default-features = false, features = ["async"] }
# mdns-sd's receiver is a `flume::Receiver<ServiceEvent>` — pull flume
# in directly so we can name the error type without leaking the transit
# crate through mdns-sd's API surface.
flume = { version = "0.11", default-features = false }
# RSA-OAEP encryption of the per-session AES key, sent in the SDP
# `rsaaeskey` attribute. We use the public "Apple AirTunes" RSA key
# whose private half lives on every RAOP receiver (AirPort Express
# firmware leak, ~2004). Pure-Rust — no OpenSSL on the Windows build.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
# AES-128-CBC for the audio payload encryption layer.
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
# Hash for RSA-OAEP MGF1 — RAOP locks this to SHA-1 (legacy).
sha1 = { version = "0.10", default-features = false }
# MD5 for RTSP Digest auth (RFC 2617) to password-protected AirPlay
# receivers — mirrors OwnTone's raop_add_auth exactly.
md-5 = { version = "0.10", default-features = false }
# Base64 for SDP attributes + Apple-Challenge response.
base64 = "0.22"
# RNG for AES key + IV + RTP SSRC + Apple-Challenge nonces.
rand = "0.8"
# X25519 for the legacy RAOP `/auth-setup` handshake — some receivers
# (AirPort Express fw 7.8+, certain Sonos) gate ANNOUNCE behind it and
# return 403 until we complete a curve25519 key exchange.
x25519-dalek = "2"
# Ed25519 long-term keys for HomeKit *persistent* pairing (Apple TV PIN
# pair-setup M5/M6 + pair-verify): the controller signs its device info
# and verifies the accessory's.
ed25519-dalek = "2"
# --- AirPlay 2 (HomeKit transient pairing + ChaCha20-Poly1305 audio) ---
# AEAD for the encrypted RTSP control channel and the per-packet audio
# encryption used by AirPlay 2 receivers (HomePod et al).
chacha20poly1305 = "0.10"
# HKDF-SHA512 derives the control/audio keys from the pairing secret.
hkdf = "0.12"
sha2 = "0.10"
# SRP-6a (3072-bit group, SHA-512) for HomeKit transient pair-setup. The
# HomeKit variant has padding/ordering quirks the generic `srp` crate
# doesn't expose, so we implement it on top of num-bigint (matches what
# pair_ap / owntone do in C).
num-bigint = "0.4"
num-traits = "0.2"
# Binary property lists for the AirPlay 2 RTSP SETUP request/response.
plist = "1"
# Wipe SRP/session key material on drop.
zeroize = "1"

# Embeds assets/StreamToSpeaker.ico into the exe (see build.rs). Windows-only
# and build-time only, so it adds nothing to the shipped binary's runtime.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Reference ALAC decoder — round-trip verifies that the compressed frames
# our encoder emits decode losslessly under our announced fmtp parameters.
alac = "0.5"

[target.'cfg(windows)'.dependencies]
# WASAPI loopback fallback. cpal supports WASAPI loopback on Windows.
cpal = "0.15"
# AAC-LC encoding for AirPlay 2 buffered audio via the OS-provided Media
# Foundation encoder (CLSID_AACMFTEncoder) — iOS senders use AAC-LC in
# buffered mode and it's the only payload codec field-proven on Sonos.
# The ergonomic `windows` crate (vs windows-sys) keeps the COM/MFT
# plumbing sane; scoped to just the Media Foundation surface.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # WinRT System Media Transport Controls — reads the OS "now playing"
    # (title/artist/album) for the opt-in metadata-forwarding feature.
    "Foundation",
    "Media_Control",
] }
# GUI: native window + system tray. Windows-only for now since the
# kernel driver is anyway Windows-only.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
tray-icon = "0.19"
# Transitively pulled in by eframe but exposed via the HasWindowHandle
# trait we use to grab the HWND for Win32 ShowWindow hide/show in
# gui.rs. Pin to the same version eframe 0.29 already uses (0.6.x)
# so we don't end up with two copies of the crate.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
# 16 (cargo's release default) instead of 1: release builds drop from
# minutes to tens of seconds. The runtime cost is negligible for this
# workload (network audio pacing, not tight CPU loops); thin LTO still
# runs cross-CGU optimization.
codegen-units = 16
# Reuse compilation across local release rebuilds; CI caches prune our
# own crate anyway, so this only helps dev machines.
incremental = true
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
