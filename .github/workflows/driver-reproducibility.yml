# Driver reproducibility check
#
# Rebuilds the kernel driver from the checked-out source the way the given
# driver-v* release was built, and compares the result with that release:
# the unsigned/lab-signed reference binary it was signed from, and the
# Microsoft-signed package installers bundle. How the release was built is
# read from its manifest.json (`repro_compare.py plan`), so only `tag` is
# needed:
#
#   * certified (WHQL, manifest `certified: true`): reference package =
#     `lab_zip` (the test-signed package the HLK lab tested). Built from the
#     tree as committed (driver.h's STREAM_TO_SPEAKER_DRIVER_BUILD is NOT
#     stamped; only the INF DriverVer carries the build number), in
#     C:\build\src;
#   * attested (manifest `attested: true`): reference package =
#     `submission_cab`, the EV-signed CAB driver-submission.yml built and
#     Microsoft signed from (its SHA-256 must equal
#     `submission_cab_signed_sha256`). driver.h is stamped with
#     `driver_build` exactly as that workflow does, and the build happens in
#     the directory the submitted .sys was linked in (read from its PDB
#     path, normally the runner checkout D:\a\<repo>\<repo>; it must agree
#     with the manifest's `build_root` when recorded). When that directory
#     is this job's own checkout the build runs in place.
#
# A manifest that is neither, or lacks a field the rebuild needs, fails the
# job at the manifest step. Both kinds use msbuild Release|x64, SignMode=Off
# and DriverBuildNumber = the manifest's `driver_build`.
#
# Checks:
#   * guard: hashFiles('driver/**','include/**') of the checkout must equal
#     the release manifest's `source_hash`, and the tree msbuild compiles
#     must be byte-identical to that checkout (certified) or differ from it
#     only by the stamped build constant in driver/driver.h (attested);
#   * StreamToSpeaker.sys: Authenticode signature removed from the released
#     copy, then raw SHA-256, then a normalised comparison that masks the PE
#     fields known to vary between builds (COFF TimeDateStamp, PE CheckSum,
#     debug-directory timestamps and the PDB GUID/age/path) and compares the
#     header block and every section from their own offsets; padding outside
#     those pieces must be zero. Anything else that differs is listed by
#     offset/size/section. The Rich header's
#     compiler/linker/library build ids are compared separately
#     (`toolset_identical`) and only warn;
#   * StreamToSpeaker.inf: compared with the DriverVer date masked (stampinf
#     writes the build date);
#   * the .cat is signed and re-issued by Microsoft - not compared.
#
# The package users actually get is the release's `signed_zip` (what
# Get-AttestedDriver.ps1 hands the installer builds), so that is checked
# too: its SHA-256 must equal the manifest's `signed_zip_sha256`, its
# catalog must verify under the kernel policy with a Microsoft Windows
# Hardware Compatibility Publisher signature, and its .sys/.inf must pass
# the same comparison against the rebuild. For an attested release its
# embedded .sys signature must verify under the kernel policy as well, its
# .sys must be the submitted one once signatures are stripped, and its INF
# must be byte-identical to the submitted one.
#
# With `installer_tag` (a v* release), the setup exe of that release is
# unpacked (innounp, pinned by hash) and its {app}\driver files must be
# byte-identical to the shipped package, with no test certificate.
# `installer_name` picks that asset by exact name (default: the release's
# only StreamToSpeakerSetup-*.exe) and `installer_sha256`, when given, is
# the hash the downloaded exe must have.
#
# Also a reusable workflow (workflow_call, same inputs): build.yml's
# `verify-driver` job runs it on v* tags against the unsigned installer the
# `package` job just attached, and `sign-release` waits for it.
#
# The job fails when a normalised comparison differs, when the shipped
# package does not verify, or when the installer check fails. Job outputs:
# `kind` (certified/attested), `raw_identical`, `normalised_identical`,
# `toolset_identical` (reference package), `shipped_identical`
# (signed_zip) and `installer_identical` (empty without `installer_tag`).
# Comparison logic: .github/scripts/repro_compare.py.
name: Driver reproducibility

on:
  # Pushes that touch the check itself re-run it with the defaults below.
  # Branches only: path filters are not evaluated for tag pushes, and v*
  # tags already run it through build.yml's verify-driver job.
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/driver-reproducibility.yml"
      - ".github/scripts/repro_compare.py"
      - ".github/scripts/test_repro_compare.py"
      - ".github/scripts/certified.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "driver-v* release to verify (certified or attested)"
        required: true
        default: "driver-v1.1.1.211"
      build_number:
        description: "Optional cross-check: must equal the release manifest's driver_build (empty = use the manifest's)"
        required: false
        default: ""
      commit:
        description: "Commit to build (empty = HEAD of the branch this is run from)"
        required: false
        default: ""
      build_root:
        description: "Override the build directory (empty = C:\\build\\src for a certified release, the directory the submitted .sys was linked in for an attested one). The PDB path the linker embeds depends on it, and its length changes the debug-directory layout."
        required: false
        default: ""
      installer_tag:
        description: "Optional v* release whose setup exe to unpack and check it bundles exactly this release's signed_zip (empty = skip)"
        required: false
        default: ""
      installer_name:
        description: "Exact setup exe asset name on installer_tag (empty = its only StreamToSpeakerSetup-*.exe)"
        required: false
        default: ""
      installer_sha256:
        description: "Expected SHA-256 of that setup exe (empty = check against its .sha256 asset if present)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "driver-v* release to verify (certified or attested)"
        type: string
        required: true
      build_number:
        description: "Optional cross-check: must equal the release manifest's driver_build"
        type: string
        required: false
        default: ""
      commit:
        description: "Commit to build (empty = the caller's commit)"
        type: string
        required: false
        default: ""
      build_root:
        description: "Override the build directory (empty = derived from the release)"
        type: string
        required: false
        default: ""
      installer_tag:
        description: "Optional v* release whose setup exe must bundle exactly this release's signed_zip"
        type: string
        required: false
        default: ""
      installer_name:
        description: "Exact setup exe asset name on installer_tag"
        type: string
        required: false
        default: ""
      installer_sha256:
        description: "Expected SHA-256 of that setup exe"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Same installer as build.yml so the WDK cache is shared with it.
  WDK_INSTALLER_URL: "https://go.microsoft.com/fwlink/?linkid=2272234"

jobs:
  reproduce:
    # windows-2022 for the same reason as build.yml (VS2022/MSBuild 17 +
    # WDK 26100's MSBuild-17 task DLLs).
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      raw_identical: ${{ steps.cmp_sys.outputs.raw_identical }}
      normalised_identical: ${{ steps.verdict.outputs.normalised_identical }}
      toolset_identical: ${{ steps.cmp_sys.outputs.toolset_identical }}
      shipped_identical: ${{ steps.verdict.outputs.shipped_identical }}
      installer_identical: ${{ steps.installer.outputs.identical }}

    steps:
      - name: Resolve parameters
        id: params
        shell: pwsh
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_BUILD: ${{ inputs.build_number }}
          IN_ROOT: ${{ inputs.build_root }}
          IN_INSTALLER: ${{ inputs.installer_tag }}
          IN_INAME: ${{ inputs.installer_name }}
          IN_ISHA: ${{ inputs.installer_sha256 }}
        run: |
          $tag = if ($env:IN_TAG) { $env:IN_TAG } else { "driver-v1.1.1.211" }
          $build = "$env:IN_BUILD".Trim()
          $root = "$env:IN_ROOT".Trim()
          if ($tag -notmatch '^driver-v\d+\.\d+\.\d+\.\d+$') { throw "tag must be a driver-v<a.b.c.d> release tag, got '$tag'" }
          if ($build -and $build -notmatch '^\d+$') { throw "build_number must be numeric, got '$build'" }
          $installer = "$env:IN_INSTALLER".Trim()
          $iname = "$env:IN_INAME".Trim()
          $isha = "$env:IN_ISHA".Trim().ToLower()
          if ($installer -and $installer -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw "installer_tag must be a v* release tag, got '$installer'" }
          if (($iname -or $isha) -and -not $installer) { throw "installer_name / installer_sha256 need installer_tag" }
          if ($iname -and $iname -notmatch '^StreamToSpeakerSetup-[0-9A-Za-z.+-]+\.exe$') { throw "installer_name must be a StreamToSpeakerSetup-*.exe asset name, got '$iname'" }
          if ($isha -and $isha -notmatch '^[0-9a-f]{64}$') { throw "installer_sha256 must be 64 hex digits, got '$isha'" }
          Write-Host "tag=$tag build_number=$build build_root=$root installer_tag=$installer installer_name=$iname installer_sha256=$isha"
          "installer_tag=$installer" >> $env:GITHUB_OUTPUT
          "installer_name=$iname" >> $env:GITHUB_OUTPUT
          "installer_sha256=$isha" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "build_number=$build" >> $env:GITHUB_OUTPUT
          "build_root=$root" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      # The comparison scripts come from the commit this workflow runs from,
      # not from `commit`: an older certified commit predates them.
      - name: Check out the comparison scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repro-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Identity of the checkout; the build step then proves the tree it
      # compiles is byte-identical to it.
      - name: Compute driver source hash
        id: srchash
        shell: pwsh
        run: |
          "hash=${{ hashFiles('driver/**', 'include/**') }}" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Unit tests of the comparison script
        shell: pwsh
        working-directory: repro-tools/.github/scripts
        run: |
          python -m unittest test_repro_compare
          if ($LASTEXITCODE -ne 0) { throw "repro_compare.py unit tests failed" }

      # How the release was built comes from its manifest (kind, build
      # number, reference package, whether driver.h was stamped); nothing
      # here is a per-release input. An unusable manifest stops the job.
      - name: Fetch release manifest and reference package
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.params.outputs.tag }}
          BUILD_NUMBER: ${{ steps.params.outputs.build_number }}
          ROOT_OVERRIDE: ${{ steps.params.outputs.build_root }}
          SOURCE_HASH: ${{ steps.srchash.outputs.hash }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path released | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern manifest.json --output released/manifest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download manifest.json from release $env:TAG" }
          $planArgs = @("plan", "released/manifest.json", $env:TAG, "--json", "plan.json")
          if ($env:BUILD_NUMBER) { $planArgs += @("--build-number", $env:BUILD_NUMBER) }
          python repro-tools/.github/scripts/repro_compare.py @planArgs
          if ($LASTEXITCODE -ne 0) { throw "release $env:TAG cannot be verified: its manifest does not say how the driver was built (see the errors above)" }
          $plan = Get-Content plan.json -Raw | ConvertFrom-Json
          $m = Get-Content released/manifest.json -Raw | ConvertFrom-Json
          Write-Host "Release $env:TAG: $($plan.kind) driver $($m.driver_version) (build $($m.driver_build)), commit $($m.commit)"
          Write-Host "  manifest source_hash : $($m.source_hash)"
          Write-Host "  checkout source_hash : $env:SOURCE_HASH"
          if ($m.source_hash -ne $env:SOURCE_HASH) {
              throw "driver source hash of this checkout does not match the release manifest - this is not the tree that $env:TAG was built from"
          }

          $asset = $plan.reference_asset
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --output "released/$asset" --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download $asset from release $env:TAG" }
          $sha = (Get-FileHash "released/$asset" -Algorithm SHA256).Hash.ToLower()
          Write-Host "  $asset sha256 $sha"
          if ($plan.reference_sha256) {
              if ($sha -ne $plan.reference_sha256) { throw "$asset sha256 $sha does not match the manifest's $($plan.reference_sha256)" }
          } elseif ($plan.kind -ne "certified") {
              throw "the manifest of $env:TAG records no hash for $asset"
          }

          # Reference .sys/.inf, flat in released/reference.
          New-Item -ItemType Directory -Force -Path released/reference, released/unpacked | Out-Null
          if ($plan.reference_type -eq "submission_cab") {
              # The EV signature on the CAB container does not change the
              # files inside.
              expand.exe -F:* "released\$asset" released\unpacked | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "expand.exe failed on $asset" }
          } else {
              Expand-Archive "released/$asset" -DestinationPath released/unpacked -Force
          }
          foreach ($n in "StreamToSpeaker.sys", "StreamToSpeaker.inf") {
              $hit = @(Get-ChildItem released/unpacked -Recurse -File -Filter $n)
              if ($hit.Count -ne 1) { throw "expected exactly one $n in $asset, found $($hit.Count)" }
              Copy-Item $hit[0].FullName "released/reference/$n"
          }
          Get-ChildItem released/reference | ForEach-Object { Write-Host "  reference: $($_.Name) ($($_.Length) bytes)" }
          if ($plan.reference_type -eq "submission_cab") {
              $sig = Get-AuthenticodeSignature released/reference/StreamToSpeaker.sys
              if ($sig.Status -ne "NotSigned") { throw "the .sys in $asset is expected to be the unsigned build Microsoft signed from, got signature status $($sig.Status)" }
          }

          $rootArgs = @("buildroot", "plan.json", "released/reference/StreamToSpeaker.sys")
          if ($env:ROOT_OVERRIDE) { $rootArgs += @("--build-root", $env:ROOT_OVERRIDE) }
          python repro-tools/.github/scripts/repro_compare.py @rootArgs
          if ($LASTEXITCODE -ne 0) { throw "could not tell where $env:TAG was built (see the error above); future attested releases record build_root in the manifest" }
          "reference_label=$(if ($plan.kind -eq 'certified') { 'lab package' } else { 'submission CAB' })" >> $env:GITHUB_OUTPUT

      # ---- WDK: copied from build.yml (same paths, same cache key) ----
      - name: Exclude WDK paths from Defender real-time scanning
        shell: pwsh
        run: |
          try {
              Add-MpPreference -ExclusionPath `
                  "C:\Program Files (x86)\Windows Kits", `
                  "C:\Program Files\Microsoft Visual Studio", `
                  "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction Stop
              Write-Host "Defender exclusions added"
          } catch {
              Write-Host "Could not add Defender exclusions ($_) - continuing"
          }

      # Restore only: this job never writes build.yml's cache entry.
      - name: Restore WDK cache
        id: cache-wdk
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Program Files (x86)\Windows Kits\10
            C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WDK
            C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Microsoft\WDK
            C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Microsoft\WDK
            C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Microsoft\WDK
          # Keyed on build.yml (not this file) on purpose: it is build.yml's
          # cache entry, so this job reuses the exact WDK tree the release
          # builds use.
          key: wdk-${{ env.WDK_INSTALLER_URL }}-v2-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            wdk-${{ env.WDK_INSTALLER_URL }}-v2-

      - name: Install WDK (cache miss)
        if: steps.cache-wdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "wdksetup.exe"
          Write-Host "Downloading WDK from $env:WDK_INSTALLER_URL"
          Invoke-WebRequest -Uri $env:WDK_INSTALLER_URL -OutFile $installer -UseBasicParsing
          Write-Host "Installing WDK (silent, ~5 min)..."
          $p = Start-Process -FilePath $installer -ArgumentList "/features", "+", "/q", "/norestart" -Wait -PassThru
          Write-Host "WDK installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "WDK installer failed with exit $($p.ExitCode)"
          }

      - name: Restore WDK registry
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10\"
          if (-not (Test-Path $kitsRoot)) {
              throw "Windows Kits\10\ missing after WDK install/restore"
          }
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                           -Name "KitsRoot10" -Value $kitsRoot -PropertyType String -Force | Out-Null
          New-Item -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots" `
                           -Name "KitsRoot10" -Value $kitsRoot -PropertyType String -Force | Out-Null
          Write-Host "KitsRoot10 = $kitsRoot"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ---- The shipped package ----
      # Installers bundle the release's signed_zip, not the lab zip: check
      # it is the file the manifest records, and that Microsoft's catalog
      # over it verifies. Its .sys/.inf are compared with the rebuild below.
      - name: Fetch and verify the shipped driver package
        id: signed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.params.outputs.tag }}
          KIND: ${{ steps.release.outputs.kind }}
        run: |
          $ErrorActionPreference = "Stop"
          $m = Get-Content released/manifest.json -Raw | ConvertFrom-Json
          if (-not $m.signed_zip -or -not $m.signed_zip_sha256) {
              throw "the manifest of $env:TAG records no signed_zip / signed_zip_sha256 - no shipped package to verify"
          }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $m.signed_zip --output "released/$($m.signed_zip)" --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download $($m.signed_zip) from release $env:TAG" }
          python repro-tools/.github/scripts/repro_compare.py package "released/$($m.signed_zip)" released/signed --sha256 $m.signed_zip_sha256 --json package-signed.json
          if ($LASTEXITCODE -ne 0) { throw "$($m.signed_zip) is not the package the manifest records (or not exactly one .sys/.inf/.cat)" }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $out = & $signtool verify /kp /v /c released/signed/StreamToSpeaker.cat released/signed/StreamToSpeaker.sys 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "signtool catalog verification of the shipped package failed" }
          if ($out -notmatch "Hardware Compatibility Publisher") { throw "the shipped catalog is not signed by the Microsoft Windows Hardware Compatibility Publisher" }
          if ($env:KIND -eq "attested") {
              # Attestation: Microsoft's signature is the primary embedded
              # one, the code is the submitted binary and the INF comes back
              # untouched (what driver-attested.yml guaranteed at publish).
              $emb = & $signtool verify /kp /v released/signed/StreamToSpeaker.sys 2>&1 | Out-String
              Write-Host $emb
              if ($LASTEXITCODE -ne 0) { throw "signtool embedded-signature verification of the shipped .sys failed" }
              if ($emb -notmatch "Hardware Compatibility Publisher") { throw "the shipped .sys is not signed by the Microsoft Windows Hardware Compatibility Publisher" }
              python repro-tools/.github/scripts/certified.py sys-match --signed released/signed/StreamToSpeaker.sys --submitted released/reference/StreamToSpeaker.sys
              if ($LASTEXITCODE -ne 0) { throw "the shipped .sys is not the .sys in the submission CAB" }
              $a = (Get-FileHash released/signed/StreamToSpeaker.inf -Algorithm SHA256).Hash
              $b = (Get-FileHash released/reference/StreamToSpeaker.inf -Algorithm SHA256).Hash
              if ($a -ne $b) { throw "the shipped INF is not byte-identical to the INF in the submission CAB" }
              Write-Host "shipped .sys = submitted .sys (signatures stripped); shipped INF = submitted INF (byte-identical)"
              "submission_match=true" >> $env:GITHUB_OUTPUT
          }
          "signed_zip=$($m.signed_zip)" >> $env:GITHUB_OUTPUT
          "signed_zip_sha256=$($m.signed_zip_sha256.ToLower())" >> $env:GITHUB_OUTPUT

      # ---- Build ----
      - name: Build driver (Release|x64, unsigned, pinned build number)
        id: build
        shell: pwsh
        env:
          BUILD_ROOT: ${{ steps.release.outputs.build_root }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          VERSION: ${{ steps.release.outputs.version }}
          STAMP: ${{ steps.release.outputs.stamp_driver_h }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:BUILD_ROOT
          if (-not $root -or $env:BUILD_NUMBER -notmatch '^\d+$') { throw "no build root / build number resolved from the release manifest" }
          $ws = (Resolve-Path $env:GITHUB_WORKSPACE).Path.TrimEnd('\')
          $inPlace = $root.TrimEnd('\') -ieq $ws
          if ($inPlace) {
              # The release was built in a runner checkout at this very
              # path: build in place, against a pristine copy of the
              # verified sources for the tree check.
              $pristine = Join-Path $env:RUNNER_TEMP "pristine-src"
              if (Test-Path $pristine) { Remove-Item -Recurse -Force $pristine }
              New-Item -ItemType Directory -Force -Path $pristine | Out-Null
              Copy-Item -Recurse driver (Join-Path $pristine "driver")
              Copy-Item -Recurse include (Join-Path $pristine "include")
              Write-Host "Building in place in $root (the checkout)"
          } else {
              $pristine = "."
              # The directory is emptied first: never one that contains
              # this checkout.
              if ("$ws\".StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "build root $root contains the job's workspace $ws; refusing to build there" }
              try {
                  if (Test-Path $root) { Remove-Item -Recurse -Force $root }
                  New-Item -ItemType Directory -Force -Path $root | Out-Null
              } catch {
                  throw "cannot create the build directory $root on this runner ($_); the release was linked at that path and the PDB path is part of the image layout"
              }
              Copy-Item -Recurse driver (Join-Path $root "driver")
              Copy-Item -Recurse include (Join-Path $root "include")
              Write-Host "Source copied to $root"
          }
          if ($env:STAMP -eq "true") {
              # Same edit as driver-submission.yml's "Stamp driver build
              # number" step.
              $path = Join-Path $root "driver\driver.h"
              $content = Get-Content $path -Raw
              $new = $content -replace '(STREAM_TO_SPEAKER_DRIVER_BUILD\s+)\d+u', "`${1}$($env:BUILD_NUMBER)u"
              Set-Content -Path $path -Value $new -NoNewline
              python repro-tools/.github/scripts/repro_compare.py tree $pristine $root --stamped-build $env:BUILD_NUMBER
              if ($LASTEXITCODE -ne 0) { throw "the build tree is not the verified checkout with driver.h stamped to build $env:BUILD_NUMBER" }
          } else {
              python repro-tools/.github/scripts/repro_compare.py tree $pristine $root
              if ($LASTEXITCODE -ne 0) { throw "the build tree differs from the checkout whose source hash was verified" }
          }
          Write-Host "driver.h: $((Select-String -Path (Join-Path $root 'driver\driver.h') -Pattern 'STREAM_TO_SPEAKER_DRIVER_BUILD').Line.Trim())"

          $log = Join-Path $env:GITHUB_WORKSPACE "msbuild-detailed.log"
          msbuild (Join-Path $root "driver\StreamToSpeaker.sln") `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SignMode=Off `
            /p:DriverBuildNumber=$env:BUILD_NUMBER `
            /nologo `
            /verbosity:minimal `
            /fileLogger "/fileLoggerParameters:LogFile=$log;Verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with exit code $LASTEXITCODE" }

          $out = Join-Path $root "driver\x64\Release"
          $sys = Get-ChildItem -Path $out -Recurse -Filter "StreamToSpeaker.sys" | Select-Object -First 1
          $inf = Get-ChildItem -Path $out -Recurse -Filter "StreamToSpeaker.inf" | Select-Object -First 1
          $pdb = Get-ChildItem -Path $out -Recurse -Filter "StreamToSpeaker.pdb" | Select-Object -First 1
          if (-not $sys -or -not $inf) { Get-ChildItem -Recurse $out | Select-Object FullName; throw "driver outputs not produced" }
          $sig = Get-AuthenticodeSignature $sys.FullName
          if ($sig.Status -ne "NotSigned") { throw "expected an unsigned .sys, got signature status $($sig.Status)" }
          $infText = Get-Content $inf.FullName -Raw
          if ($infText -notmatch [regex]::Escape(",$env:VERSION")) { throw "built INF does not carry DriverVer $env:VERSION - stampinf failed?" }
          New-Item -ItemType Directory -Force -Path fresh | Out-Null
          Copy-Item $sys.FullName fresh/StreamToSpeaker.sys
          Copy-Item $inf.FullName fresh/StreamToSpeaker.inf
          if ($pdb) { Copy-Item $pdb.FullName fresh/StreamToSpeaker.pdb }
          Write-Host "fresh .sys sha256 $((Get-FileHash fresh/StreamToSpeaker.sys -Algorithm SHA256).Hash.ToLower())"
          Write-Host "fresh INF: $((Select-String -Path fresh/StreamToSpeaker.inf -Pattern 'DriverVer').Line.Trim())"

      - name: Record toolset versions
        id: toolset
        shell: pwsh
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10"
          $lines = @()
          $lines += "runner image: $env:ImageOS $env:ImageVersion"
          $lines += "msbuild: $((msbuild -version -nologo | Select-Object -Last 1))"
          $log = Get-Content msbuild-detailed.log -Raw
          $tools = [regex]::Matches($log, '(?i)[A-Z]:\\[^"\r\n]*?\\(?:CL|link|stampinf|inf2cat)\.exe') |
                   ForEach-Object { $_.Value } | Sort-Object -Unique
          foreach ($t in $tools) {
              $fv = (Get-Item $t -ErrorAction SilentlyContinue).VersionInfo.FileVersion
              $lines += "$t : $fv"
          }
          $lines += "SDK/WDK versions under $kits\Include: $((Get-ChildItem "$kits\Include" -Directory | ForEach-Object Name) -join ', ')"
          foreach ($exe in "signtool.exe", "stampinf.exe", "inf2cat.exe") {
              $f = Get-ChildItem "$kits\bin" -Recurse -Filter $exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
              if ($f) { $lines += "$($f.FullName) : $($f.VersionInfo.FileVersion)" }
          }
          $kits_installed = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'Windows Driver Kit|Windows Software Development Kit' } |
              ForEach-Object { "$($_.DisplayName) $($_.DisplayVersion)" } | Sort-Object -Unique
          if ($kits_installed) { $lines += "installed kits: $($kits_installed -join '; ')" }
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Set-Content toolset.txt
          # Command lines as msbuild ran them (cl / link / stampinf), for the artifact.
          [regex]::Matches($log, '(?im)^\s*[A-Z]:\\[^\r\n]*?\\(?:CL|link|stampinf|inf2cat)\.exe .*$') |
              ForEach-Object { $_.Value.Trim() } | Sort-Object -Unique | Set-Content tool-commands.txt

      # ---- Compare ----
      - name: Strip the reference .sys's Authenticode signature (signtool remove /s)
        shell: pwsh
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path released/stripped | Out-Null
          Copy-Item released/reference/StreamToSpeaker.sys released/stripped/StreamToSpeaker.sys
          Write-Host "reference .sys (as released) sha256 $((Get-FileHash released/reference/StreamToSpeaker.sys -Algorithm SHA256).Hash.ToLower())"
          $status = (Get-AuthenticodeSignature released/reference/StreamToSpeaker.sys).Status
          if ($status -eq "NotSigned") {
              Write-Host "reference .sys carries no signature (submission build); nothing to remove"
          } elseif ($signtool) {
              & $signtool.FullName remove /s released/stripped/StreamToSpeaker.sys
              if ($LASTEXITCODE -ne 0) { throw "signtool remove /s failed with $LASTEXITCODE" }
              Write-Host "signature removed with $($signtool.FullName)"
          } else {
              Write-Host "::warning::signtool.exe not found; the comparison script strips the certificate table itself"
          }
          Write-Host "reference .sys (stripped)    sha256 $((Get-FileHash released/stripped/StreamToSpeaker.sys -Algorithm SHA256).Hash.ToLower())"

      - name: Compare StreamToSpeaker.sys
        id: cmp_sys
        continue-on-error: true
        shell: pwsh
        run: |
          python repro-tools/.github/scripts/repro_compare.py sys released/stripped/StreamToSpeaker.sys fresh/StreamToSpeaker.sys --json compare-sys.json
          exit $LASTEXITCODE

      - name: Compare StreamToSpeaker.inf
        id: cmp_inf
        continue-on-error: true
        shell: pwsh
        run: |
          python repro-tools/.github/scripts/repro_compare.py inf released/reference/StreamToSpeaker.inf fresh/StreamToSpeaker.inf --json compare-inf.json
          exit $LASTEXITCODE

      - name: Compare the shipped StreamToSpeaker.sys
        id: cmp_ship_sys
        continue-on-error: true
        shell: pwsh
        run: |
          python repro-tools/.github/scripts/repro_compare.py sys released/signed/StreamToSpeaker.sys fresh/StreamToSpeaker.sys --json compare-shipped-sys.json
          exit $LASTEXITCODE

      - name: Compare the shipped StreamToSpeaker.inf
        id: cmp_ship_inf
        continue-on-error: true
        shell: pwsh
        run: |
          python repro-tools/.github/scripts/repro_compare.py inf released/signed/StreamToSpeaker.inf fresh/StreamToSpeaker.inf --json compare-shipped-inf.json
          exit $LASTEXITCODE

      # ---- Installer (optional) ----
      # Unpacks the release's setup exe without running it and checks that
      # the {app}\driver files are the shipped package, byte for byte, and
      # that no test certificate rides along. innounp because innoextract
      # stops at Inno Setup 6.0.5/6.1; pinned by hash.
      - name: Check the installer bundles the shipped package
        id: installer
        if: steps.params.outputs.installer_tag != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ITAG: ${{ steps.params.outputs.installer_tag }}
          INAME: ${{ steps.params.outputs.installer_name }}
          ISHA: ${{ steps.params.outputs.installer_sha256 }}
          INNOUNP_URL: https://github.com/jrathlev/InnoUnpacker-Windows-GUI/releases/download/oi_2_2_11/innounp-2.zip
          INNOUNP_SHA256: 851772538a041229102ad9964542d49dc00c74002e3091a70469c079ae368f52
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $pattern = if ($env:INAME) { $env:INAME } else { "StreamToSpeakerSetup-*.exe" }
          gh release download $env:ITAG --repo $env:GITHUB_REPOSITORY --pattern $pattern --pattern "$pattern.sha256" --dir installer --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download $pattern from release $env:ITAG" }
          $exes = @(Get-ChildItem installer -Filter $pattern)
          if ($exes.Count -ne 1) { throw "expected exactly one $pattern on $env:ITAG, found $($exes.Count)" }
          $exe = $exes[0]
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "$($exe.Name) sha256 $sha"
          "exe=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "exe_sha256=$sha" >> $env:GITHUB_OUTPUT
          if ($env:ISHA) {
              if ($sha -ne $env:ISHA) { throw "$($exe.Name) on $env:ITAG hashes to $sha, expected $env:ISHA - not the installer this check was asked about" }
              Write-Host "  matches the expected sha256"
          }
          $sidecar = "$($exe.FullName).sha256"
          if (Test-Path $sidecar) {
              $want = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLower()
              if ($want -ne $sha) { throw "$($exe.Name) hashes to $sha but its .sha256 asset says $want" }
              Write-Host "  matches $($exe.Name).sha256"
          } else {
              Write-Host "::warning::$env:ITAG has no $($exe.Name).sha256 asset"
          }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "  Authenticode: $($sig.Status) $($sig.SignerCertificate.Subject)"

          $zip = Join-Path $env:RUNNER_TEMP "innounp-2.zip"
          Invoke-WebRequest -Uri $env:INNOUNP_URL -OutFile $zip -UseBasicParsing
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:INNOUNP_SHA256) { throw "innounp-2.zip sha256 $got, expected $env:INNOUNP_SHA256" }
          $tool = Join-Path $env:RUNNER_TEMP "innounp"
          Expand-Archive $zip -DestinationPath $tool -Force
          & (Join-Path $tool "innounp.exe") -x -b -y -q -dinstaller\unpacked $exe.FullName "{app}\driver\*.*"
          if ($LASTEXITCODE -ne 0) { throw "innounp could not unpack $($exe.Name) (exit $LASTEXITCODE)" }
          $sys = @(Get-ChildItem installer\unpacked -Recurse -Filter StreamToSpeaker.sys)
          if ($sys.Count -ne 1) { Get-ChildItem -Recurse installer\unpacked | Select-Object FullName; throw "expected one StreamToSpeaker.sys in the installer, found $($sys.Count)" }
          $dir = $sys[0].DirectoryName
          Get-ChildItem $dir | ForEach-Object { Write-Host "  installer: $($_.Name) ($($_.Length) bytes)" }
          "signature=$($sig.Status)" >> $env:GITHUB_OUTPUT
          $cer = @(Get-ChildItem $dir -Filter *.cer)
          "test_cert=$([bool]$cer.Count)".ToLower() >> $env:GITHUB_OUTPUT
          python repro-tools/.github/scripts/repro_compare.py files released/signed $dir --json installer-files.json
          $same = $LASTEXITCODE -eq 0
          "identical=$($same.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($cer.Count) { throw "$($exe.Name) ships a test certificate ($($cer.Name -join ', ')) next to the driver" }
          if (-not $same) { throw "$($exe.Name) does not bundle the shipped package of this release" }

      - name: Summary
        id: verdict
        shell: pwsh
        env:
          TAG: ${{ steps.params.outputs.tag }}
          KIND: ${{ steps.release.outputs.kind }}
          REF_ASSET: ${{ steps.release.outputs.reference_asset }}
          REF_LABEL: ${{ steps.release.outputs.reference_label }}
          BUILD_ROOT: ${{ steps.release.outputs.build_root }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          STAMP: ${{ steps.release.outputs.stamp_driver_h }}
          SUBMISSION_MATCH: ${{ steps.signed.outputs.submission_match }}
          SYS_RAW: ${{ steps.cmp_sys.outputs.raw_identical }}
          SYS_NORM: ${{ steps.cmp_sys.outputs.normalised_identical }}
          SYS_TOOLSET: ${{ steps.cmp_sys.outputs.toolset_identical }}
          INF_RAW: ${{ steps.cmp_inf.outputs.raw_identical }}
          INF_NORM: ${{ steps.cmp_inf.outputs.normalised_identical }}
          SHIP_ZIP: ${{ steps.signed.outputs.signed_zip }}
          SHIP_ZIP_SHA: ${{ steps.signed.outputs.signed_zip_sha256 }}
          SHIP_SYS_RAW: ${{ steps.cmp_ship_sys.outputs.raw_identical }}
          SHIP_SYS_NORM: ${{ steps.cmp_ship_sys.outputs.normalised_identical }}
          SHIP_INF_NORM: ${{ steps.cmp_ship_inf.outputs.normalised_identical }}
          ITAG: ${{ steps.params.outputs.installer_tag }}
          INST_OUTCOME: ${{ steps.installer.outcome }}
          INST_EXE: ${{ steps.installer.outputs.exe }}
          INST_SHA: ${{ steps.installer.outputs.exe_sha256 }}
          INST_SIG: ${{ steps.installer.outputs.signature }}
          INST_SAME: ${{ steps.installer.outputs.identical }}
          INST_CER: ${{ steps.installer.outputs.test_cert }}
        run: |
          $ok = ($env:SYS_NORM -eq 'true') -and ($env:INF_NORM -eq 'true')
          "normalised_identical=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $shipOk = ($env:SHIP_SYS_NORM -eq 'true') -and ($env:SHIP_INF_NORM -eq 'true')
          "shipped_identical=$($shipOk.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $s = @()
          $s += "## Driver reproducibility: $env:TAG ($env:KIND)"
          $s += ""
          $s += "Rebuilt as the release was built: DriverBuildNumber $env:BUILD_NUMBER, driver.h $(if ($env:STAMP -eq 'true') { "stamped with build $env:BUILD_NUMBER" } else { 'as committed (not stamped)' }), in ``$env:BUILD_ROOT``. Reference: the $env:REF_LABEL ``$env:REF_ASSET``."
          $s += ""
          $s += "### Reference package ($env:REF_LABEL)"
          $s += ""
          $s += "| File | raw identical | normalised identical |"
          $s += "|---|---|---|"
          $s += "| StreamToSpeaker.sys (signature stripped) | $env:SYS_RAW | $env:SYS_NORM |"
          $s += "| StreamToSpeaker.inf (DriverVer date masked) | $env:INF_RAW | $env:INF_NORM |"
          $s += "| streamtospeaker.cat | not compared (signed, re-issued by Microsoft) | |"
          $s += ""
          $s += "### Shipped package"
          $s += ""
          $s += "``$env:SHIP_ZIP`` sha256 ``$env:SHIP_ZIP_SHA`` (matches the manifest; catalog verified, Microsoft Windows Hardware Compatibility Publisher)"
          $s += ""
          if ($env:KIND -eq "attested") {
              $s += "Embedded .sys signature verified (kernel policy, Microsoft Windows Hardware Compatibility Publisher); .sys identical to the submitted one after stripping signatures and INF byte-identical to the submitted one: **$(if ($env:SUBMISSION_MATCH) { $env:SUBMISSION_MATCH } else { 'no verdict' })**"
              $s += ""
          }
          $s += "| File | raw identical | normalised identical |"
          $s += "|---|---|---|"
          $s += "| StreamToSpeaker.sys (signatures stripped) | $env:SHIP_SYS_RAW | $env:SHIP_SYS_NORM |"
          $s += "| StreamToSpeaker.inf (DriverVer date masked) | | $env:SHIP_INF_NORM |"
          $s += ""
          if ($env:ITAG) {
              $s += "### Installer $env:ITAG"
              $s += ""
              $s += "``$env:INST_EXE`` sha256 ``$env:INST_SHA``, Authenticode $env:INST_SIG"
              $s += ""
              $s += "Bundles the shipped package byte for byte: **$(if ($env:INST_SAME) { $env:INST_SAME } else { 'no verdict' })**; test certificate shipped: $(if ($env:INST_CER) { $env:INST_CER } else { '?' }) (step $env:INST_OUTCOME)"
              if (Test-Path installer-files.json) {
                  $r = Get-Content installer-files.json -Raw | ConvertFrom-Json
                  $s += ""
                  $s += "| File | shipped package | installer |"
                  $s += "|---|---|---|"
                  foreach ($p in $r.files.PSObject.Properties) { $s += "| $($p.Name) | ``$($p.Value.a)`` | ``$($p.Value.b)`` |" }
              }
              $s += ""
          }
          $s += "Same toolset (Rich header compiler/linker/library build ids): $env:SYS_TOOLSET"
          $s += ""
          if ($env:SYS_TOOLSET -ne 'true') {
              Write-Host "::warning::the released .sys was linked by a different compiler/linker/WDK build than this runner has (see the Rich header rows in the summary); code compared regardless"
          }
          if (Test-Path compare-sys.json) {
              $r = Get-Content compare-sys.json -Raw | ConvertFrom-Json
              $s += "### StreamToSpeaker.sys"
              $s += ""
              $s += "| | released | fresh |"
              $s += "|---|---|---|"
              $s += "| stripped sha256 | ``$($r.released.stripped_sha256)`` | ``$($r.fresh.stripped_sha256)`` |"
              $s += "| size | $($r.released.size) | $($r.fresh.size) |"
              $s += "| linker | $($r.released.linker_version) | $($r.fresh.linker_version) |"
              $s += "| COFF timestamp | $($r.released.coff_timestamp) | $($r.fresh.coff_timestamp) |"
              $pr = ($r.released.debug | Where-Object pdb_path | Select-Object -First 1)
              $pf = ($r.fresh.debug | Where-Object pdb_path | Select-Object -First 1)
              $s += "| PDB | ``$($pr.pdb_path)`` guid $($pr.pdb_guid) age $($pr.pdb_age) | ``$($pf.pdb_path)`` guid $($pf.pdb_guid) age $($pf.pdb_age) |"
              $rich = { param($x) if ($x) { ($x.entries | ForEach-Object { "$($_.product_id):$($_.build)x$($_.count)" }) -join ', ' } else { 'none' } }
              $s += "| Rich header (product:build x count) | $(& $rich $r.released.rich) | $(& $rich $r.fresh.rich) |"
              $s += ""
              if ($r.differing_regions.Count -gt 0) {
                  $s += "Differing byte ranges after masking:"
                  $s += ""
                  $s += "| offset | size | region |"
                  $s += "|---|---|---|"
                  foreach ($d in $r.differing_regions) { $s += "| 0x{0:x8} | {1} | {2} |" -f $d.offset, $d.size, $d.region }
                  $s += ""
              }
          }
          if (Test-Path compare-inf.json) {
              $r = Get-Content compare-inf.json -Raw | ConvertFrom-Json
              $s += "### StreamToSpeaker.inf"
              $s += ""
              $s += "released: ``$($r.released.driverver)``, fresh: ``$($r.fresh.driverver)``"
              foreach ($d in $r.differing_lines) { $s += "- line $($d.line): released ``$($d.released)`` / fresh ``$($d.fresh)``" }
              $s += ""
          }
          if (Test-Path toolset.txt) {
              $s += "### Toolset"
              $s += ""
              $s += '```'
              $s += Get-Content toolset.txt
              $s += '```'
          }
          $s | Add-Content $env:GITHUB_STEP_SUMMARY
          $s | ForEach-Object { Write-Host $_ }

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-reproducibility-${{ steps.params.outputs.tag }}${{ steps.params.outputs.installer_tag && format('-{0}', steps.params.outputs.installer_tag) || '' }}
          path: |
            fresh/
            plan.json
            released/manifest.json
            released/stripped/
            released/signed/
            compare-sys.json
            compare-inf.json
            compare-shipped-sys.json
            compare-shipped-inf.json
            package-signed.json
            installer-files.json
            toolset.txt
            tool-commands.txt
            msbuild-detailed.log
          if-no-files-found: warn

      - name: Verdict
        shell: pwsh
        env:
          OK: ${{ steps.verdict.outputs.normalised_identical }}
          KIND: ${{ steps.release.outputs.kind }}
          REF_LABEL: ${{ steps.release.outputs.reference_label }}
          SUBMISSION_MATCH: ${{ steps.signed.outputs.submission_match }}
          SYS_RAW: ${{ steps.cmp_sys.outputs.raw_identical }}
          SYS_NORM: ${{ steps.cmp_sys.outputs.normalised_identical }}
          SYS_TOOLSET: ${{ steps.cmp_sys.outputs.toolset_identical }}
          INF_NORM: ${{ steps.cmp_inf.outputs.normalised_identical }}
          SHIP_SYS_NORM: ${{ steps.cmp_ship_sys.outputs.normalised_identical }}
          SHIP_INF_NORM: ${{ steps.cmp_ship_inf.outputs.normalised_identical }}
          SHIP_OK: ${{ steps.verdict.outputs.shipped_identical }}
          ITAG: ${{ steps.params.outputs.installer_tag }}
          INST_OUTCOME: ${{ steps.installer.outcome }}
        run: |
          # A comparison that crashed sets no output; that is an error of the
          # check, not evidence that the driver is not reproducible.
          if (-not $env:SYS_NORM -or -not $env:INF_NORM -or -not $env:SHIP_SYS_NORM -or -not $env:SHIP_INF_NORM) { throw "a comparison step did not complete (see its log); no verdict" }
          if ($env:KIND -ne 'certified' -and $env:KIND -ne 'attested') { throw "release kind '$env:KIND' not resolved; no verdict" }
          if ($env:KIND -eq 'attested' -and $env:SUBMISSION_MATCH -ne 'true') { throw "the shipped package was not tied to the submission CAB; no verdict" }
          if ($env:OK -ne 'true') { throw "the rebuilt driver differs from the released $env:REF_LABEL beyond the masked fields (see summary)" }
          if ($env:SHIP_OK -ne 'true') { throw "the rebuilt driver differs from the shipped signed_zip beyond the masked fields (see summary)" }
          if ($env:ITAG -and $env:INST_OUTCOME -ne 'success') { throw "installer check for $env:ITAG failed (see its step log and the summary)" }
          if ($env:ITAG) { Write-Host "Installer $env:ITAG bundles the shipped package." }
          if ($env:SYS_RAW -eq 'true') { Write-Host "Byte-for-byte reproducible." }
          elseif ($env:SYS_TOOLSET -eq 'true') { Write-Host "Reproducible up to timestamps / checksum / PDB identity." }
          else { Write-Host "Code and data reproducible; headers differ only in timestamps / checksum / PDB identity / toolset build ids." }
