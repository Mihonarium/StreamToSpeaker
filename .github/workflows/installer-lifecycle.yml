name: Installer lifecycle

# Installs, repairs, uninstalls and upgrades the installer on a disposable
# runner and checks what each step leaves behind (logic and checks in
# .github/scripts/Test-InstallerLifecycle.ps1):
#
#   the scripts' own tests (Windows PowerShell)
#   → Setup refuses Windows Server, a test build without test signing, and
#     a /DIR= outside Program Files, each before changing anything
#   → fresh install → repair
#   → update while the app runs, here and in another account
#   → uninstall (with the test certificate's file gone)
#   → start at sign-in through /TASKS → uninstall
#   → previous public release → upgrade to this build
#     (→ to the Microsoft-signed-driver variant, when built) → uninstall
#   → previous public release in C:\STS [lifecycle], with a file of the
#     person's and a fake uninstaller planted there → update, which moves
#     it to Program Files → uninstall
#   → an older release (default v0.1.6) → upgrade → uninstall
#
# A user-data sentinel in %APPDATA%\StreamToSpeaker must survive all of it:
# uninstall deliberately leaves user data in place. This build's
# Install-Driver.ps1 must log into the install directory, never into the
# user's profile.
#
# Hosted runners run Windows Server without test-signing, so the driver
# never starts here. Setup must say so: its exit code and the result its
# driver step logs must agree with the device Windows has. Everything the
# installer itself controls is required (files, Apps & Features entry,
# shortcuts, certificate trust, driver store, exactly one device, the
# firewall rule, start at sign-in). Every phase runs even after one failed;
# the Verdict step fails the job if any did.
#
# Called by build.yml on pull requests that touch the installer (same run,
# so it tests exactly the installer that run built), or dispatched by hand
# against an earlier Build installer run's artifacts: the run given as
# build_run_id, else the newest successful run that this repository's own
# branch started (a push or a dispatch, never a pull request, which can
# come from a fork) for exactly the commit being tested.

on:
  workflow_call:
    inputs:
      version:
        description: Version the calling build stamped into the installer
        type: string
        required: true
      previous_tag:
        description: "Release to upgrade from (default: newest vX.Y.Z release with an installer)"
        type: string
        required: false
        default: ""
      older_tag:
        description: "A second, older release to upgrade from (default: v0.1.6, the first with a Microsoft-signed driver)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build installer run whose installer to test (default: the latest successful push or dispatch run of this commit on this branch)"
        required: false
        default: ""
      previous_tag:
        description: "Release to upgrade from (default: newest vX.Y.Z release with an installer)"
        required: false
        default: ""
      older_tag:
        description: "A second, older release to upgrade from (default: v0.1.6, the first with a Microsoft-signed driver)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  # Releases live in the upstream repository, also for runs on forks.
  RELEASES_REPO: Mihonarium/StreamToSpeaker

jobs:
  lifecycle:
    # Same image as the build, so the installer meets the OS it was built
    # alongside.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The installers run as administrator; the job's token stays out
          # of .git/config.
          persist-credentials: false

      - name: Locate the build to test
        id: src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ inputs.build_run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $run = ""
          if ($env:EVENT -eq "workflow_dispatch") {
              $run = $env:RUN_ID
              if (-not $run) {
                  # Only runs this repository's own branch started (a pull
                  # request's run can come from a fork whose branch has the
                  # same name), and only for the commit under test.
                  $runs = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow build.yml --branch $env:BRANCH `
                      --status success --limit 50 --json databaseId,event,headSha,headBranch | ConvertFrom-Json)
                  if ($LASTEXITCODE -ne 0) { throw "could not list the 'Build installer' runs" }
                  $own = @($runs | Where-Object {
                      $_.event -in @('push', 'workflow_dispatch') -and $_.headSha -eq $env:GITHUB_SHA -and $_.headBranch -eq $env:BRANCH })
                  if (-not $own.Count) {
                      throw "No successful 'Build installer' run of $env:GITHUB_SHA started from $env:BRANCH (push or dispatch); pass build_run_id."
                  }
                  $run = "$($own[0].databaseId)"
              }
              if ($run -notmatch '^\d+$') { throw "build_run_id must be a run number, got '$run'" }
              Write-Host "Testing artifacts of run $run"
          } else {
              Write-Host "Testing artifacts of this run"
          }
          "run_id=$run" >> $env:GITHUB_OUTPUT

      - name: Download installers (this run)
        if: steps.src.outputs.run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: StreamToSpeakerSetup-*
          path: dist/installer
          merge-multiple: true

      - name: Download binaries (this run)
        if: steps.src.outputs.run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/binaries
          merge-multiple: true

      - name: Download installers (build run ${{ steps.src.outputs.run_id }})
        if: steps.src.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: StreamToSpeakerSetup-*
          path: dist/installer
          merge-multiple: true
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download binaries (build run ${{ steps.src.outputs.run_id }})
        if: steps.src.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/binaries
          merge-multiple: true
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      # Each installer has a <name>.driver.json build record naming the
      # driver kind it bundles; the test-signed one is always built.
      - name: Pick the installers under test
        id: pick
        shell: pwsh
        env:
          CALLER_VERSION: ${{ inputs.version }}
        run: |
          $records = @(Get-ChildItem dist/installer -Filter "StreamToSpeakerSetup-*.driver.json")
          if (-not $records) { throw "no installer build records in the artifact" }
          $dev = $null; $prod = $null
          foreach ($r in $records) {
              $j = Get-Content $r.FullName -Raw | ConvertFrom-Json
              # The name comes from the record and becomes a path to run.
              if ("$($j.installer)" -notmatch '^StreamToSpeakerSetup-[A-Za-z0-9._-]+\.exe$') {
                  throw "record $($r.Name) names an installer that is not a plain StreamToSpeakerSetup-*.exe file name: '$($j.installer)'"
              }
              $exe = Join-Path $r.DirectoryName $j.installer
              if (-not (Test-Path $exe)) { throw "record $($r.Name) names missing installer $($j.installer)" }
              Write-Host "$($j.installer): driver $($j.driver.kind), test certificate $($j.test_cert)"
              if ($j.driver.kind -eq "test-signed") { $dev = @{ exe = $exe; rec = $r.FullName; name = $j.installer } }
              elseif (-not $prod) { $prod = @{ exe = $exe; rec = $r.FullName } }
          }
          if (-not $dev) { throw "no test-signed installer in the artifact" }
          $version = $env:CALLER_VERSION
          if (-not $version) { $version = $dev.name -replace '^StreamToSpeakerSetup-', '' -replace '\.exe$', '' }
          $exe = Get-ChildItem dist/binaries -Recurse -Filter stream-to-speaker.exe | Select-Object -First 1
          if (-not $exe) { throw "no stream-to-speaker.exe in the binaries artifact" }
          Write-Host "Version under test: $version"
          # Paths and versions reach later steps as environment variables,
          # never spliced into their scripts.
          @(
              "STS_VERSION=$version"
              "STS_DEV_EXE=$($dev.exe)"
              "STS_DEV_RECORD=$($dev.rec)"
              "STS_SERVICE_EXE=$($exe.FullName)"
              "STS_PROD_EXE=$(if ($prod) { $prod.exe })"
              "STS_PROD_RECORD=$(if ($prod) { $prod.rec })"
          ) | Add-Content $env:GITHUB_ENV
          "has_prod=$(if ($prod) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # Two earlier releases to upgrade from: the newest non-draft,
      # non-prerelease vX.Y.Z release carrying a setup exe (or previous_tag),
      # and older_tag (the first release with a Microsoft-signed driver, so
      # an install made by the oldest kind of setup still in use).
      # driver-v* releases are skipped by the tag shape. Each one's .sha256
      # sidecar, when published, must match the download.
      - name: Download earlier releases' installers
        id: prev
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_TAG: ${{ inputs.previous_tag }}
          OLDER_TAG: ${{ inputs.older_tag || 'v0.1.6' }}
        run: |
          $rels = gh api --paginate "repos/$env:RELEASES_REPO/releases?per_page=100" --jq '.[]' |
              ForEach-Object { $_ | ConvertFrom-Json }
          # An asset's name becomes a file name here and a path to run later.
          $setup = { param($r) @($r.assets | Where-Object { $_.name -match '^StreamToSpeakerSetup-[A-Za-z0-9._-]+\.exe$' }) }
          function Get-Release([string]$tag, [string]$key, [string]$envName) {
              if ($tag) {
                  $rel = $rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
              } else {
                  $rel = $rels |
                      Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' -and (& $setup $_).Count -gt 0 } |
                      Sort-Object { [version]$_.tag_name.Substring(1) } -Descending |
                      Select-Object -First 1
              }
              if (-not $rel -or -not (& $setup $rel)) {
                  Write-Host "::warning::No release $(if ($tag) { $tag } else { 'with an installer' }); skipping its upgrade path."
                  "$key=false" >> $env:GITHUB_OUTPUT
                  return
              }
              $assets = & $setup $rel
              # Prefer the Microsoft-signed-driver installer over a -testsigned fallback.
              $asset = ($assets | Where-Object { $_.name -notmatch '-testsigned\.exe$' } | Select-Object -First 1)
              if (-not $asset) { $asset = $assets[0] }
              $dir = "dist/$key"
              New-Item -ItemType Directory -Force $dir | Out-Null
              gh release download $rel.tag_name --repo $env:RELEASES_REPO --pattern $asset.name --dir $dir
              if ($LASTEXITCODE -ne 0) { throw "download failed" }
              $path = Join-Path $dir $asset.name
              $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
              if ($rel.assets | Where-Object { $_.name -eq "$($asset.name).sha256" }) {
                  gh release download $rel.tag_name --repo $env:RELEASES_REPO --pattern "$($asset.name).sha256" --dir $dir
                  if ($LASTEXITCODE -ne 0) { throw "sidecar download failed" }
                  $want = ((Get-Content "$path.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
                  if ($want -ne $hash) { throw "$($asset.name): sha256 $hash does not match the published $want" }
                  Write-Host "$($asset.name) matches its published sha256"
              } else {
                  Write-Host "::warning::$($rel.tag_name) publishes no .sha256 for $($asset.name)"
              }
              $sig = Get-AuthenticodeSignature $path
              Write-Host "$($key): $($rel.tag_name) / $($asset.name) sha256 $hash, Authenticode $($sig.Status) ($($sig.SignerCertificate.Subject))"
              $version = $rel.tag_name -replace '^v', ''
              "$key=true" >> $env:GITHUB_OUTPUT
              "$($key)_version=$version" >> $env:GITHUB_OUTPUT
              "$($envName)_EXE=$((Resolve-Path $path).Path)" | Add-Content $env:GITHUB_ENV
              "$($envName)_VERSION=$version" | Add-Content $env:GITHUB_ENV
          }
          Get-Release $env:WANT_TAG "found" "STS_PREV"
          Get-Release $env:OLDER_TAG "older" "STS_OLDER"

      # Every phase runs even when an earlier one failed, so that one run
      # shows every case; the Verdict step at the end fails the job if any
      # phase did.
      - name: The scripts' own tests (Windows PowerShell)
        id: units
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase units

      - name: Runner state + user-data sentinel
        id: env
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase env

      - name: Setup refuses Windows Server
        id: refuse_server
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase refuse-server
          -Installer $env:STS_DEV_EXE

      - name: Setup refuses a test build on a PC without test signing
        id: refuse_test_build
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase refuse-test-build
          -Installer $env:STS_DEV_EXE

      - name: Setup refuses a folder outside Program Files
        id: refuse_dir
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase refuse-dir
          -Installer $env:STS_DEV_EXE -InstallDir 'C:\STS [lifecycle]'

      - name: Fresh install
        id: install
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase install
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Repair (reinstall over itself)
        id: repair
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase repair
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Silent update while the app runs
        id: running_app
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase running-app
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Silent update while the app runs in another account
        id: other_account
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase other-account
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Uninstall (after the certificate file went missing)
        id: uninstall
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase uninstall -DeleteCertificateFile

      - name: Start at sign-in through /TASKS
        id: tasks
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase tasks
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Uninstall (start at sign-in on)
        id: uninstall_tasks
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase uninstall

      - name: Install the previous release (${{ steps.prev.outputs.found_version }})
        id: previous
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase previous
          -Installer $env:STS_PREV_EXE -ExpectVersion $env:STS_PREV_VERSION

      - name: Upgrade to this build
        id: upgrade
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase upgrade
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      # Test-signed install → Microsoft-signed-driver install of the same
      # build, the path a tester takes from a dev build to a release.
      - name: Upgrade to the Microsoft-signed-driver installer
        id: upgrade_prod
        if: steps.prev.outputs.found == 'true' && steps.pick.outputs.has_prod == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase upgrade
          -Installer $env:STS_PROD_EXE -DriverRecord $env:STS_PROD_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Uninstall after the upgrades
        id: uninstall_upgraded
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase uninstall

      # An earlier release in a folder outside Program Files: the update
      # moves it into Program Files and runs nothing from the old folder.
      - name: Install the previous release in C:\STS [lifecycle]
        id: previous_elsewhere
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase previous
          -Installer $env:STS_PREV_EXE -ExpectVersion $env:STS_PREV_VERSION
          -InstallDir 'C:\STS [lifecycle]'

      - name: Plant a file of the person's and a fake uninstaller there
        id: plant
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase plant
          -InstallDir 'C:\STS [lifecycle]'

      - name: Update, which moves it to Program Files
        id: upgrade_moved
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase upgrade
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE
          -EarlierDir 'C:\STS [lifecycle]'

      - name: Uninstall after the move
        id: uninstall_moved
        if: steps.prev.outputs.found == 'true'
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase uninstall

      - name: Install an older release (${{ steps.prev.outputs.older_version }})
        id: older
        if: steps.prev.outputs.older == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase previous
          -Installer $env:STS_OLDER_EXE -ExpectVersion $env:STS_OLDER_VERSION

      - name: Upgrade the older release to this build
        id: upgrade_older
        if: steps.prev.outputs.older == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          .github/scripts/Test-InstallerLifecycle.ps1 -Phase upgrade
          -Installer $env:STS_DEV_EXE -DriverRecord $env:STS_DEV_RECORD
          -ExpectVersion $env:STS_VERSION -ExpectExe $env:STS_SERVICE_EXE

      - name: Final uninstall
        id: uninstall_final
        if: steps.prev.outputs.older == 'true'
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/Test-InstallerLifecycle.ps1 -Phase uninstall

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "lifecycle\logs"
          New-Item -ItemType Directory -Force $out | Out-Null
          # The test copies the install-time transcript after each setup run,
          # since uninstall deletes it; these are whatever is still in place
          # (after a phase that stopped early).
          $transcripts = [ordered]@{
              "final-install.log"         = Join-Path $env:ProgramFiles "Stream To Speaker\logs\install.log"
              "final-install-profile.log" = Join-Path $env:LOCALAPPDATA "StreamToSpeaker\install.log"
          }
          foreach ($name in $transcripts.Keys) {
              if (Test-Path -LiteralPath $transcripts[$name]) {
                  Copy-Item -LiteralPath $transcripts[$name] (Join-Path $out $name)
              }
          }
          $setupapi = Join-Path $env:windir "INF\setupapi.dev.log"
          if (Test-Path $setupapi) {
              Get-Content $setupapi -Tail 3000 | Set-Content (Join-Path $out "setupapi.dev.tail.log")
          }

      - name: Verdict
        if: always()
        shell: pwsh
        env:
          STEPS: ${{ toJson(steps) }}
        run: |
          $failed = @()
          $steps = $env:STEPS | ConvertFrom-Json
          foreach ($p in $steps.PSObject.Properties) {
              $outcome = $p.Value.outcome
              Write-Host "$($p.Name): $outcome"
              if ($outcome -eq 'failure') { $failed += $p.Name }
          }
          if ($failed.Count) { throw "failed: $($failed -join ', ')" }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-lifecycle-logs
          path: ${{ runner.temp }}/lifecycle
          if-no-files-found: warn
          retention-days: 14
