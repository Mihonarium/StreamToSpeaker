name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the installer filename (default: 0.1.0-<short-sha>)"
        required: false
        default: ""

# Read-only by default; the release jobs that write to the draft release
# declare their own permissions.
permissions:
  contents: read

# Runs for the same v* tag never overlap: they work on the same draft
# release. Other runs each get a group of their own.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pin to the latest published 24H2 WDK at time of writing. Bump
  # whenever the build switches to a newer header.
  WDK_INSTALLER_URL: "https://go.microsoft.com/fwlink/?linkid=2272234"

jobs:
  build:
    # Pinned: windows-latest moved to Windows Server 2025 + Visual Studio
    # 2026 (MSBuild 18) in June 2026, whose driver-kit integration can't
    # load our WDK's MSBuild 17 task DLLs (MSB4062 on ValidateNTTargetVersion
    # — Microsoft.DriverKit.Build.Tasks.18.0.dll doesn't exist in WDK 26100).
    # windows-2022 keeps VS2022/MSBuild 17 and is supported for years; see
    # actions/runner-images#14017. Revisit with an EWDK or a VS2026-matched
    # WDK when one ships.
    runs-on: windows-2022
    # v* tag builds restore no Rust cache (see "Cache Rust dependencies"
    # below), so every one of them compiles every dependency, as other runs
    # do only when the cache misses. A timeout there fails the release, and
    # a re-run compiles cold again, so they get twice the time.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 120 || 60 }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      viversion: ${{ steps.ver.outputs.viversion }}
      source_hash: ${{ steps.srchash.outputs.hash }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history — the driver build number is `git rev-list --count
          # HEAD`, which silently evaluates to 1 on the default depth-1
          # shallow clone (so CI-built drivers were all stamped 1.0.0.1).
          fetch-depth: 0
          # Nothing in this job pushes; no token is left in .git/config for
          # the build scripts and third-party actions that run here.
          persist-credentials: false

      # Identity hash of the driver source. Computed BEFORE the build stamps
      # driver.h with the build number so it matches what a clean checkout
      # hashes to — driver-v* release manifests record the same expression
      # (driver-submission.yml), which is how installer builds find the
      # Microsoft-attested driver that corresponds to this exact source.
      - name: Compute driver source hash
        id: srchash
        shell: pwsh
        run: |
          "hash=${{ hashFiles('driver/**', 'include/**') }}" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------
      # Compute two version strings:
      #   version   — free-form, used in filename + display ("0.1.0-abc1234")
      #   viversion — strict X.Y.Z.W numeric, required for the Win32
      #               VersionInfo resource Inno Setup bakes into setup.exe
      # Tag push  v1.2.3   → version 1.2.3,        viversion 1.2.3.0
      # Dispatch with a version (not on a tag) → that version
      # Otherwise          → version 0.1.0-<sha>,  viversion 0.1.0.0
      # The version must be <major>.<minor>.<patch> plus an optional suffix
      # of letters, digits and . + - ; anything else (a tag such as
      # v1.2.3$(...) included) fails here, before it reaches a file name,
      # a step output or a later job. On a tag the tag is the version: a
      # dispatched version that differs from it is refused.
      # -----------------------------------------------------------------
      - name: Compute version
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $v = ""
          if ($env:GITHUB_REF -clike "refs/tags/v*") {
              $v = $env:GITHUB_REF.Substring("refs/tags/v".Length)
              if ($env:EVENT -eq "workflow_dispatch" -and $env:INPUT_VERSION -and $env:INPUT_VERSION -cne $v) {
                  throw "a dispatch on a tag builds the tag's version; leave the version input empty"
              }
          } elseif ($env:EVENT -eq "workflow_dispatch" -and $env:INPUT_VERSION) {
              $v = $env:INPUT_VERSION
          } else {
              $v = "0.1.0-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          if ($v -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*\z') {
              throw "the version must be <major>.<minor>.<patch> optionally followed by letters, digits and . + - (from the tag or the version input)"
          }
          # Numeric prefix of $v, padded to 4 parts.
          $prefix = ($v -split "[-+]")[0]
          $parts = $prefix -split "\."
          while ($parts.Count -lt 4) { $parts += "0" }
          # Strip any non-numeric parts (paranoia — Inno rejects them).
          $parts = $parts | ForEach-Object { if ($_ -match "^\d+$") { $_ } else { "0" } }
          $vi = $parts[0..3] -join "."
          Write-Host "version=$v  viversion=$vi"
          "version=$v" >> $env:GITHUB_OUTPUT
          "viversion=$vi" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------
      # Toolchains
      # -----------------------------------------------------------------
      # The action's v1 requires `toolchain` (only its branches named after
      # a toolchain, such as `stable`, supply one), so it is named here.
      - name: Set up Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Rust dependency cache. Swatinem/rust-cache instead of a plain
      # actions/cache on target/: it keys on the *rustc version* as well as
      # Cargo.lock (a plain lock-keyed cache goes permanently stale every
      # 6-week toolchain bump, because actions/cache never re-saves on a
      # key hit — deps then recompile on every run), it prunes our own
      # crate's artifacts from target/ before saving (only dependencies are
      # worth caching; smaller entries also relieve the repo's 10 GB cache
      # budget that the WDK/driver caches share), and it saves even when a
      # later step fails.
      #
      # Skipped on v* tags: the release exe, which the chain below EV-signs,
      # is built with nothing restored from a Rust cache entry another run
      # wrote (tag runs can restore main's entries), so tag builds compile
      # every dependency. Nothing is saved on tags either: only later runs
      # for the same tag could restore such an entry.
      - name: Cache Rust dependencies (not on release tags)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: service
          cache-on-failure: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # -----------------------------------------------------------------
      # Prebuilt-driver cache.
      #
      # The kernel-mode driver only needs rebuilding when its *source*
      # changes, so key a cache on a hash of driver/ + the shared ABI
      # header. On a hit we skip the WDK, the signing-cert generation, and
      # the MSBuild entirely, and reuse the prebuilt test-signed binaries
      # — crucially INCLUDING the .cer that signed them, so the cert the
      # installer ships always matches the cached .sys/.cat.
      #
      # Versioning consequence: the driver build number (INF DriverVer
      # revision + STREAM_TO_SPEAKER_DRIVER_BUILD) is now stamped only when
      # the driver is actually rebuilt — i.e. it tracks the commit count at
      # the last driver change rather than HEAD. Still monotonic across
      # driver changes, so PnP upgrade comparison is unaffected.
      #
      # restore/save split (not plain actions/cache) so a build that fails
      # before the cache is populated can't poison the key. Bump the `v1`
      # tag to force a rebuild after changing build flags without touching
      # driver source.
      # -----------------------------------------------------------------
      - name: Restore prebuilt driver cache
        id: cache-driver
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: driver-cache
          key: driver-${{ runner.os }}-v2-${{ env.WDK_INSTALLER_URL }}-${{ hashFiles('driver/**', 'include/**') }}

      # -----------------------------------------------------------------
      # WDK install (~5 min cold) + cache.
      #
      # Cached paths cover what the WindowsKernelModeDriver10.0 toolset
      # actually reads at build time:
      #   - "Windows Kits\10\" — SDK + WDK headers, libs, redist tools
      #   - "MSBuild\Microsoft\WDK\" under each plausible VS installation
      #     — the .props/.targets that define the toolset itself
      #
      # The KitsRoot10 registry value is re-applied separately because
      # actions/cache doesn't persist the registry. It's tiny and
      # idempotent so we always run that step.
      #
      # Cache key bumps on every WDK URL change AND on any edit to the
      # workflow file (so this section can be iterated without poisoning
      # an old cache).
      # -----------------------------------------------------------------
      # The WDK tree is ~50k small files; per-file Defender scanning is the
      # dominant cost of the cache restore (measured: 293 s restore vs 67 s
      # driver build). Excluding the target paths before extraction is a
      # no-op if the image has real-time protection off — the step timing
      # of "Restore WDK cache" is the measurement either way.
      - name: Exclude WDK paths from Defender real-time scanning
        shell: pwsh
        run: |
          try {
              Add-MpPreference -ExclusionPath `
                  "C:\Program Files (x86)\Windows Kits", `
                  "C:\Program Files\Microsoft Visual Studio", `
                  "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction Stop
              Write-Host "Defender exclusions added"
          } catch {
              Write-Host "Could not add Defender exclusions ($_) - continuing"
          }

      - name: Restore WDK cache
        id: cache-wdk
        if: steps.cache-driver.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            C:\Program Files (x86)\Windows Kits\10
            C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WDK
            C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Microsoft\WDK
            C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Microsoft\WDK
            C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Microsoft\WDK
          key: wdk-${{ env.WDK_INSTALLER_URL }}-v2-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            wdk-${{ env.WDK_INSTALLER_URL }}-v2-

      - name: Install WDK (cache miss)
        if: steps.cache-driver.outputs.cache-hit != 'true' && steps.cache-wdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "wdksetup.exe"
          Write-Host "Downloading WDK from $env:WDK_INSTALLER_URL"
          Invoke-WebRequest -Uri $env:WDK_INSTALLER_URL -OutFile $installer -UseBasicParsing
          Write-Host "Installing WDK (silent, ~5 min)..."
          $p = Start-Process -FilePath $installer -ArgumentList "/features", "+", "/q", "/norestart" -Wait -PassThru
          Write-Host "WDK installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "WDK installer failed with exit $($p.ExitCode)"
          }

      # Reapply the KitsRoot10 registry value. The WDK installer sets it;
      # actions/cache doesn't persist registry, so on a cache HIT we have
      # to recreate it before MSBuild can find the toolset.
      - name: Restore WDK registry
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10\"
          if (-not (Test-Path $kitsRoot)) {
              throw "Windows Kits\10\ missing after WDK install/restore"
          }
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" `
                           -Name "KitsRoot10" -Value $kitsRoot -PropertyType String -Force | Out-Null
          New-Item -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots" `
                           -Name "KitsRoot10" -Value $kitsRoot -PropertyType String -Force | Out-Null
          Write-Host "KitsRoot10 = $kitsRoot"

      # Visual Studio's developer command prompt needs to be activated
      # to expose msbuild on PATH for the driver toolset.
      - name: Add MSBuild to PATH
        if: steps.cache-driver.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        with:
          msbuild-architecture: x64

      # -----------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------
      # Generate a self-signed test code-signing certificate so we can
      # actually sign the driver — Windows in test-signing mode loads
      # signed-by-untrusted drivers but refuses *un*signed ones. The
      # cert lives only in the CurrentUser\My store; signtool /a (used
      # by the vcxproj's TestSign target) auto-selects it. We also
      # export the .cer so the installer can import it to the target
      # machine's TrustedPublisher + Root stores.
      - name: Generate test-signing certificate
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Stream To Speaker (test sign)" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5) `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          Write-Host "Generated cert thumbprint: $($cert.Thumbprint)"
          $cerPath = Join-Path $env:RUNNER_TEMP "StreamToSpeaker.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Write-Host "Exported .cer to $cerPath ($((Get-Item $cerPath).Length) bytes)"
          # Trust it locally too so signtool & inf2cat are happy on the
          # build agent and the driver is loadable for any CI smoke
          # test we add later.
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null

      # Stamp the driver build number with the git commit count so
      # every build is uniquely identifiable from:
      #   - The INF's DriverVer (1.0.0.N — what Device Manager and
      #     PnP version-comparison use)
      #   - The service log ('StreamToSpeaker driver opened build=N')
      # Both come from the same git rev-list count, so they stay in
      # sync and a user can confirm at a glance whether the kernel
      # actually loaded the new .sys.
      - name: Compute driver build number
        id: drvbuild
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $count = (git rev-list --count HEAD).Trim()
          # Update driver.h for the runtime build identifier.
          $path = "driver/driver.h"
          $content = Get-Content $path -Raw
          $new = $content -replace '(STREAM_TO_SPEAKER_DRIVER_BUILD\s+)\d+u', "`${1}${count}u"
          Set-Content -Path $path -Value $new -NoNewline
          Write-Host "Driver build stamped: $count (driver.h + INF DriverVer 1.0.0.$count)"
          "build=$count" >> $env:GITHUB_OUTPUT

      - name: Build driver (Release|x64, test-signed)
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          msbuild driver\StreamToSpeaker.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SignMode=TestSign `
            /p:DriverBuildNumber=${{ steps.drvbuild.outputs.build }} `
            /nologo `
            /verbosity:minimal
          # Fail fast on msbuild errors. Without this, the artifact scan
          # below could pick up stale bits and the step only failed at the
          # very end via the shell's trailing $LASTEXITCODE check.
          if ($LASTEXITCODE -ne 0) {
              throw "msbuild failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "driver\x64\Release\StreamToSpeaker\StreamToSpeaker.sys")) {
              Get-ChildItem -Recurse driver\x64\Release\ | Select-Object FullName
              throw "Driver .sys not produced where expected"
          }
          # Verify the .sys actually got signed.
          $sys = Get-ChildItem -Recurse driver\x64\Release\ -Filter "StreamToSpeaker.sys" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $sys.FullName
          Write-Host "Driver signature status: $($sig.Status) (signer: $($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne "Valid" -and $sig.Status -ne "UnknownError") {
              # UnknownError is common with self-signed certs that aren't
              # rooted in a public CA; that's expected here. Anything else
              # is a real problem.
              throw "Driver signature unexpected status: $($sig.Status)"
          }
          # Collect the signed driver + the .cer that signed it + devcon
          # into driver-cache/ so the cache save and staging read uniformly,
          # and the shipped cert always matches the cached binaries.
          $dc = "driver-cache"
          New-Item -ItemType Directory -Force -Path $dc | Out-Null
          # The .pdb rides along for Partner Center attestation submissions
          # (the submission CAB must include the symbol file).
          foreach ($name in "StreamToSpeaker.sys", "StreamToSpeaker.inf", "StreamToSpeaker.cat", "StreamToSpeaker.pdb") {
              $f = Get-ChildItem -Path "driver\x64\Release" -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $f) { throw "driver output $name not found for cache" }
              Copy-Item $f.FullName (Join-Path $dc $name) -Force
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP "StreamToSpeaker.cer") (Join-Path $dc "StreamToSpeaker.cer") -Force
          $devcon = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Tools" -Recurse -Filter "devcon.exe" -ErrorAction SilentlyContinue `
                    | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $devcon) { throw "devcon.exe not found under WDK Tools" }
          Copy-Item $devcon.FullName (Join-Path $dc "devcon.exe") -Force
          Write-Host "Populated $dc/ (driver + cert + devcon) for cache + staging"

      - name: Save prebuilt driver cache
        if: steps.cache-driver.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: driver-cache
          key: ${{ steps.cache-driver.outputs.cache-primary-key }}

      # On tag builds, make the crate version match the release tag so
      # `--version`, CARGO_PKG_VERSION and the exe's metadata agree with the
      # installer filename and the in-app update check. The repo's
      # Cargo.toml keeps its own number between releases; only the built
      # artifact is stamped. First `^version` line only — the file also has
      # a bare `version = "…"` under a dependency table further down.
      - name: Stamp crate version from the tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: service
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          $toml = Get-Content Cargo.toml -Raw
          $re = [regex]::new('(?m)^version = "[^"]*"')
          if (-not $re.IsMatch($toml)) { throw "no package version line in Cargo.toml" }
          $stamped = $re.Replace($toml, "version = `"$v`"", 1)
          Set-Content Cargo.toml $stamped -NoNewline
          Write-Host "Cargo.toml package version stamped to $v"

      - name: Build service (cargo --release)
        shell: pwsh
        working-directory: service
        env:
          # Bake the release tag into the exe on tag builds so the in-app
          # update check (and the version label) use the *installed
          # release*, not the crate version — the two are independent.
          # Empty on non-tag builds → dev build → update checks disabled.
          STS_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && steps.ver.outputs.version || '' }}
        run: cargo build --release

      # The exe must run on a clean Windows install, which has the UCRT but
      # not the Visual C++ runtime DLLs (service/.cargo/config.toml links
      # the C runtime statically). Fail if it imports any of them.
      - name: Check the service exe needs no Visual C++ runtime DLL
        shell: pwsh
        working-directory: service
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
              Where-Object { $_.FullName -match '\\Hostx64\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin /nologo /dependents target\release\stream-to-speaker.exe | Out-String
          Write-Host $deps
          if ($deps -match '(?im)^\s*(vcruntime\d+(_\d+)?|msvcp\d+(_\w+)?|concrt\d+)\.dll') {
              throw "stream-to-speaker.exe imports a Visual C++ runtime DLL ($($Matches[0].Trim())), which a clean Windows install doesn't have"
          }

      # The unit tests never ran in CI before this step existed. --release
      # shares the artifacts just built. The second command runs the one
      # `#[ignore]`d test: a live WinHTTP round-trip to the GitHub releases
      # API — the update check's transport, which can only be exercised on
      # a Windows host with network. It authenticates with the job token
      # (shared runner IPs exhaust the anonymous 60/h quota) and treats a
      # rate-limit answer as a skip, so it can't block a release build.
      - name: Test service (unit tests + live update-check fetch)
        shell: pwsh
        working-directory: service
        env:
          STS_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && steps.ver.outputs.version || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo test --release
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          cargo test --release -- --ignored live_github_fetch
          if ($LASTEXITCODE -ne 0) { throw "live update-check fetch failed" }

      - name: Stage artifacts for installer
        shell: pwsh
        run: |
          $staging = "installer\staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "service\target\release\stream-to-speaker.exe" "$staging\stream-to-speaker.exe"
          # The driver binaries, the test-signing cert that signed them, and
          # devcon all come from driver-cache/ — populated by the build above
          # or restored from cache — so the shipped .cer always matches the
          # shipped .sys/.cat regardless of which path produced them.
          $dc = "driver-cache"
          foreach ($name in "StreamToSpeaker.sys", "StreamToSpeaker.inf", "StreamToSpeaker.cat", "devcon.exe", "StreamToSpeaker.cer") {
              $src = Join-Path $dc $name
              if (-not (Test-Path $src)) { throw "driver-cache missing $name" }
              Copy-Item $src "$staging\$name" -Force
              Write-Host "Staged $name"
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VIVERSION: ${{ steps.ver.outputs.viversion }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not at $iscc" }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DVersionInfoVersion=$env:VIVERSION" `
            "installer\StreamToSpeaker.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

      # Which driver package each installer bundles: a <installer>.driver.json
      # next to the exe (uploaded with it, except on tag pushes, which
      # upload no dev installer) and a table in the step summary.
      - name: Record the bundled driver (test-signed installer)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_HASH: ${{ steps.srchash.outputs.hash }}
        run: |
          .github/scripts/Write-DriverRecord.ps1 -StagingDir installer\staging -OutDir installer\out `
            -Installer "StreamToSpeakerSetup-$env:VERSION.exe" -Kind test-signed `
            -SourceHash $env:SOURCE_HASH

      # -----------------------------------------------------------------
      # Production-driver installer preview (PRs / main pushes / dispatch).
      #
      # If a driver-v* release carries a Microsoft-signed driver (WHQL-
      # certified preferred, else attestation-signed) whose manifest
      # source_hash matches the CURRENT driver source, build a second
      # installer that bundles that driver package instead of the
      # test-signed one — and ships NO test certificate, which makes the
      # .iss skip the cert-import steps entirely (they're gated on the .cer
      # existing). This runs on service-only commits too; that's the point:
      # the driver source is unchanged, so the signed binaries stay valid.
      # The artifact suffix names the kind (-certified / -attested). Tag
      # pushes skip this — the `package` job builds the release installer
      # (with the EV-signed service exe) instead.
      # -----------------------------------------------------------------
      - name: Fetch Microsoft-signed driver (if one matches the driver source)
        id: attested
        # Every non-tag build: PRs included, so a service-only PR yields an
        # installer with the production driver that reviewers can run
        # without testsigning mode. Tag pushes are handled by `package`.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HASH: ${{ steps.srchash.outputs.hash }}
        run: |
          # -WarnOnError: here the package only adds a preview installer,
          # so a failed lookup costs that preview (with a warning) instead
          # of failing the build; a driver package that does not match its
          # manifest still fails it. The tag pipeline's `package` job fails
          # on either.
          .github/scripts/Get-AttestedDriver.ps1 -SourceHash $env:SOURCE_HASH -OutDir attested-driver -WarnOnError

      - name: Build production-driver installer preview
        if: steps.attested.outputs.found == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VIVERSION: ${{ steps.ver.outputs.viversion }}
          SOURCE_HASH: ${{ steps.srchash.outputs.hash }}
          KIND: ${{ steps.attested.outputs.kind }}
          DRIVER_TAG: ${{ steps.attested.outputs.tag }}
          DRIVER_VERSION: ${{ steps.attested.outputs.version }}
          DRIVER_BUILD: ${{ steps.attested.outputs.build }}
          DRIVER_ZIP: ${{ steps.attested.outputs.zip }}
        run: |
          $staging = "installer\staging"
          foreach ($name in "StreamToSpeaker.sys", "StreamToSpeaker.inf", "StreamToSpeaker.cat") {
              Copy-Item "attested-driver\$name" "$staging\$name" -Force
          }
          Remove-Item "$staging\StreamToSpeaker.cer" -ErrorAction SilentlyContinue
          $kind = $env:KIND
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DVersionInfoVersion=$env:VIVERSION" `
            "/FStreamToSpeakerSetup-$env:VERSION-$kind" `
            "installer\StreamToSpeaker.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          Write-Host "Production-driver installer built: Microsoft-signed ($kind) driver $env:DRIVER_VERSION from $env:DRIVER_TAG"
          .github/scripts/Write-DriverRecord.ps1 -StagingDir $staging -OutDir installer\out `
            -Installer "StreamToSpeakerSetup-$env:VERSION-$kind.exe" -Kind $kind `
            -SourceHash $env:SOURCE_HASH -Tag $env:DRIVER_TAG `
            -Version $env:DRIVER_VERSION -Build $env:DRIVER_BUILD `
            -Zip $env:DRIVER_ZIP

      # Compute SHA256 of every shipped artifact so users can verify
      # downloads. Hashes go three places:
      #   - Job log (visible in raw CI output)
      #   - GitHub step summary (rendered at the top of the workflow run
      #     page — users can read it without expanding any step)
      #   - .sha256 sidecar files alongside the .exe (attached to the
      #     GitHub Release on tag pushes and uploaded as artifacts)
      - name: Compute artifact SHA256 hashes
        shell: pwsh
        run: |
          $items = @(
              Get-ChildItem -Path "installer\out" -Filter "StreamToSpeakerSetup-*.exe" -ErrorAction SilentlyContinue
              Get-Item "service\target\release\stream-to-speaker.exe" -ErrorAction SilentlyContinue
              Get-Item "driver-cache\StreamToSpeaker.sys" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if (-not $items) { throw "No artifacts found to hash" }

          $summary = @()
          $summary += "## SHA256 hashes"
          $summary += ""
          $summary += "| File | SHA256 |"
          $summary += "| --- | --- |"
          foreach ($item in $items) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $item.FullName).Hash.ToLower()
              Write-Host "$hash  $($item.Name)"
              # Sidecar file in the standard `<hash>  <filename>` shasum format.
              $sidecar = "$($item.FullName).sha256"
              "$hash  $($item.Name)" | Set-Content -Path $sidecar -Encoding ascii -NoNewline
              $summary += "| ``$($item.Name)`` | ``$hash`` |"
          }
          $summary -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # -----------------------------------------------------------------
      # Publish
      # -----------------------------------------------------------------
      # Not on tag pushes: a tag run's artifacts sit next to the release,
      # and the test-signed dev installer must not pass for it. The release
      # installer comes from the `package` job.
      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StreamToSpeakerSetup-${{ steps.ver.outputs.version }}
          path: |
            installer/out/StreamToSpeakerSetup-*.exe
            installer/out/StreamToSpeakerSetup-*.driver.json
          if-no-files-found: error
          retention-days: 30
          # Artifacts of earlier attempts stay on the run; without overwrite a
          # re-run of this job would add a second artifact of the same name.
          overwrite: true

      # The service exe in here is unsigned. On tag pushes no later job
      # reads this artifact, so it is kept for the minimum of one day there;
      # other builds keep the repository's default retention (0).
      - name: Upload raw driver + service binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ steps.ver.outputs.version }}
          overwrite: true
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 0 }}
          path: |
            driver-cache/StreamToSpeaker.sys
            driver-cache/StreamToSpeaker.inf
            driver-cache/StreamToSpeaker.cat
            driver-cache/StreamToSpeaker.pdb
            service/target/release/stream-to-speaker.exe
            service/target/release/stream-to-speaker.exe.sha256
          if-no-files-found: warn

      # Tag pushes: hand the build outputs to the release jobs below. The
      # release installer is NOT the one built above — the `package` job
      # rebuilds it around the EV-signed service exe (and the attested
      # driver, when one matches); this artifact carries the inputs it
      # needs that only exist in this job (test-signed driver + cert as
      # the fallback, devcon, the service exe to be signed). It holds
      # unsigned binaries, so it is kept for one day, the minimum:
      # sign-service and package read it within the hours the chain runs.
      - name: Upload release inputs (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs
          path: |
            driver-cache/
            service/target/release/stream-to-speaker.exe
          if-no-files-found: error
          retention-days: 1
          # A re-run of the build job replaces the earlier attempt's artifact.
          overwrite: true

  # -------------------------------------------------------------------
  # Tag-push release pipeline: build → sign-service → package →
  # verify-driver → sign-release → publish (and cleanup, which runs after
  # sign-release and deletes artifacts with unsigned binaries that nothing
  # reads any more).
  #
  # The version is assembled in a DRAFT release (release_draft.py) and
  # becomes public only in the last job, `publish`, once the draft holds
  # every asset of a complete release. A draft is visible only to accounts
  # with push access: not to releases/latest (the app's update check), not
  # to the /releases/latest/download/ links, not to the public release
  # list. If any job fails or is cancelled nothing is published; re-running
  # the failed jobs continues on the same draft (uploads replace earlier
  # ones), and `publish` refuses a draft that is not complete or whose
  # exes are not the bytes this run signed. Every job that writes to the
  # draft or asks for a signature first checks that the tag still points
  # at this run's commit. A published release becomes latest only if no
  # published release (other than a pre-release) has a version at least
  # as high.
  #
  # A release whose installer falls back to the test-signed driver is
  # published as a pre-release and never made latest: releases/latest, the
  # stable download link and the app's update check stay on the last
  # release with a Microsoft-signed driver.
  #
  # The artifacts that carry unsigned binaries between the jobs
  # (release-inputs, unsigned-service-exe, unsigned-setup-exe, the build
  # job's binaries-<ver> and the release gate's comparison artifact) are
  # kept for one day; cleanup, after sign-release, deletes the first four
  # once nothing reads them (the gate's artifact expires); a tag run
  # uploads no test-signed dev installer. Re-running
  # a job after the artifact it reads has expired or been deleted fails
  # before anything is signed; re-run all jobs then.
  #
  # The unsigned setup exe is never a release asset: `package` uploads it
  # as the workflow artifact `unsigned-setup-exe`. verify-driver
  # (driver-reproducibility.yml as the release gate) rebuilds the driver
  # from the tagged source, requires it to match the Microsoft-signed
  # driver release `package` picked (identical apart from the masked
  # build-varying header fields) and requires that artifact to bundle the
  # release's signed package byte for byte. sign-release signs the artifact
  # only when the gate reports verified='true' for exactly that driver
  # release and installer hash; the test-signed fallback skips the gate,
  # with warnings.
  #
  # Every EV signature goes through the central signing repo
  # (Mihonarium/signing, sign.yml) via .github/actions/request-signing:
  # dispatch with an Actions artifact of this run + its hash, wait for the
  # human approval gate there, then verify the signed bytes. Two approval
  # clicks per release: the service exe, then the setup exe (the sha256 to
  # check is shown in each signing run's name).
  #
  # Setup (one-time):
  #   - Environment "request-signing" (Settings -> Environments) holding
  #     the secret SIGNING_REPO_TOKEN: a fine-grained PAT scoped to ONLY
  #     the signing repo, with Actions: Read and write. Nothing else.
  #     Set the environment's "Deployment branches and tags" policy to
  #     Selected + tag pattern `v*` + branch `main` (main is needed by
  #     driver-submission.yml's sign-cab job; no required reviewers —
  #     the human gate lives in the signing repo). The env-level secret
  #     + ref policy means a workflow edited on some branch can neither
  #     read the PAT nor dispatch signing requests; a plain repo secret
  #     would be readable by any workflow run in this repo.
  #   - A tag ruleset restricts creating, moving and deleting v* tags to
  #     the Repository admin role: the ref policy above limits refs, not
  #     people, so it is what keeps a tag on an edited workflow from
  #     reaching the signing requests.
  #   - Unsigned bytes travel to the signing repo as Actions artifacts
  #     (private-source mode): the signing workflow fetches them
  #     post-approval with its FETCH_TOKEN environment secret (fine-grained
  #     PAT, Actions: Read-only on this repo). Works with this repo private.
  #
  # NB the step-summary hash table printed by the build job shows the DEV
  # (test-signed, unsigned-exe) build outputs; the .sha256 sidecars on the
  # release assets are regenerated by these jobs and are canonical.
  # -------------------------------------------------------------------

  # EV-sign the service exe first, so the released installer CONTAINS a
  # signed binary (better AV/firewall-prompt story than only signing the
  # setup wrapper). Creates the draft release. The unsigned exe travels as
  # a workflow artifact; only the signed exe lands on the draft.
  sign-service:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    environment: request-signing
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read              # gh run download of the unsigned-exe artifact
      id-token: write            # build-provenance attestation (public repo only)
      attestations: write
    outputs:
      # The signed bytes of this run: package and publish accept only
      # this exe from the draft.
      signed_sha256: ${{ steps.sign.outputs.signed-sha256 }}
    # The release jobs' scripts read values from the environment
    # (GITHUB_REF_NAME, GITHUB_SHA, GITHUB_REPOSITORY and the variables
    # set here), never from expressions spliced into the script text.
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-inputs
          path: release-inputs

      - name: Create the draft release + stage unsigned service exe
        id: upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$env:VERSION") { throw "the build job's version is not the version of the tag $tag" }
          python .github/scripts/test_release_draft.py -b
          if ($LASTEXITCODE -ne 0) { throw "release_draft.py unit tests failed" }
          $name = "stream-to-speaker-$env:VERSION.exe"
          Copy-Item "release-inputs\service\target\release\stream-to-speaker.exe" $name
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          # A draft until `publish`; refuses a tag whose release is already
          # published (a published release is never modified) and a tag that
          # no longer points at this run's commit, also when the draft
          # already exists.
          python .github/scripts/release_draft.py ensure $tag --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "could not create or find the draft release for $tag (see above)" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      # The unsigned exe travels to the signing repo as a workflow artifact
      # (private-source mode) — it is never a release asset; only the signed
      # exe lands on the draft.
      - name: Upload unsigned service exe as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-service-exe
          path: ${{ steps.upload.outputs.name }}
          if-no-files-found: error
          # Read by the signing repo once the request is approved; one day,
          # the minimum, is enough (a re-run of this job uploads it again).
          # The cleanup job deletes it after sign-release finishes or is
          # skipped, if sign-service succeeded.
          retention-days: 1
          # A re-run of this job replaces the earlier attempt's artifact.
          overwrite: true

      - name: Sign service exe via central signing workflow
        id: sign
        uses: ./.github/actions/request-signing
        with:
          source-run-id: ${{ github.run_id }}
          source-artifact: unsigned-service-exe
          expected-sha256: ${{ steps.upload.outputs.sha }}
          output-name: ${{ steps.upload.outputs.name }}
          sig-description: "Stream To Speaker"
          token: ${{ secrets.SIGNING_REPO_TOKEN }}

      - name: Upload the signed exe to the draft release
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed-path }}
          SIGNED_SHA256: ${{ steps.sign.outputs.signed-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit to upload to (see above)" }
          "$env:SIGNED_SHA256  $(Split-Path $env:SIGNED -Leaf)" |
              Set-Content -Path "$env:SIGNED.sha256" -Encoding ascii -NoNewline
          gh release upload $env:GITHUB_REF_NAME $env:SIGNED "$env:SIGNED.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }

      # Provenance for the exact bytes users download (post-signing, so the
      # digest matches the release asset). Gated on visibility: attestations
      # for private repos need GitHub Enterprise Cloud. Verify with:
      #   gh attestation verify stream-to-speaker-<ver>.exe -R ${{ github.repository }}
      - name: Attest build provenance (public repo only)
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.sign.outputs.signed-path }}

      # Ship the Sigstore bundle beside the binary so anyone can verify
      # offline (gh attestation verify --bundle) without querying GitHub.
      - name: Upload the attestation bundle to the draft release
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed-path }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit to upload to (see above)" }
          $bundle = "$(Split-Path $env:SIGNED -Leaf).sigstore.json"
          Copy-Item -LiteralPath $env:BUNDLE_PATH $bundle
          gh release upload $env:GITHUB_REF_NAME $bundle --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }

  # Build the RELEASE installer: EV-signed service exe + the
  # Microsoft-signed driver package (WHQL-certified preferred over
  # attestation-signed) when one matches this tag's driver source (then no
  # test cert is shipped and the .iss skips cert import).
  # Falls back to the test-signed driver + cert — clearly labelled
  # `-testsigned` — when no Microsoft-signed driver matches, so releases
  # still work before the first signing round-trip. An error while looking
  # for the driver stops the job instead (Get-AttestedDriver.ps1 without
  # -WarnOnError). The installer leaves this job only as the workflow
  # artifact `unsigned-setup-exe`; it is never attached to a release.
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-service]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write            # reads the draft release (drafts need push access)
    outputs:
      driver_found: ${{ steps.attested.outputs.found }}
      driver_tag: ${{ steps.attested.outputs.tag }}
      installer_name: ${{ steps.iscc.outputs.name }}
      installer_sha256: ${{ steps.iscc.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      VIVERSION: ${{ needs.build.outputs.viversion }}
      SOURCE_HASH: ${{ needs.build.outputs.source_hash }}
      SERVICE_SHA256: ${{ needs.sign-service.outputs.signed_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-inputs
          path: release-inputs

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fetch Microsoft-signed driver (if one matches the driver source)
        id: attested
        shell: pwsh
        run: |
          .github/scripts/Get-AttestedDriver.ps1 -SourceHash $env:SOURCE_HASH -OutDir attested-driver

      # The service exe on the draft must be exactly the one sign-service
      # signed in this run, not one another run uploaded since.
      - name: Download the EV-signed service exe from the draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit (see above)" }
          $name = "stream-to-speaker-$env:VERSION.exe"
          New-Item -ItemType Directory -Force -Path svc | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern $name --dir svc
          if ($LASTEXITCODE -ne 0) { throw "gh release download of $name failed" }
          $exe = @(Get-ChildItem svc -Filter $name)
          if ($exe.Count -ne 1) { throw "expected $name on the draft release, found $($exe.Count)" }
          $svcExe = $exe[0].FullName
          $got = (Get-FileHash -LiteralPath $svcExe -Algorithm SHA256).Hash.ToLower()
          if ($env:SERVICE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw "sign-service reported no signed sha256" }
          if ($got -ne $env:SERVICE_SHA256) { throw "$name on the draft release (sha256 $got) is not the exe sign-service signed in this run (sha256 $env:SERVICE_SHA256)" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool verify /pa $svcExe
          if ($LASTEXITCODE -ne 0) { throw "the service exe on the draft release is not validly signed - did sign-service complete?" }

      - name: Stage + build release installer
        id: iscc
        shell: pwsh
        env:
          FOUND: ${{ steps.attested.outputs.found }}
          KIND: ${{ steps.attested.outputs.kind }}
          DRIVER_TAG: ${{ steps.attested.outputs.tag }}
          DRIVER_VERSION: ${{ steps.attested.outputs.version }}
          DRIVER_BUILD: ${{ steps.attested.outputs.build }}
          DRIVER_ZIP: ${{ steps.attested.outputs.zip }}
        run: |
          $ErrorActionPreference = "Stop"
          $staging = "installer\staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "svc\stream-to-speaker-$env:VERSION.exe" "$staging\stream-to-speaker.exe"

          $dc = "release-inputs\driver-cache"
          $suffix = ""
          if ($env:FOUND -eq "true") {
              foreach ($name in "StreamToSpeaker.sys", "StreamToSpeaker.inf", "StreamToSpeaker.cat") {
                  Copy-Item "attested-driver\$name" "$staging\$name" -Force
              }
              Copy-Item "$dc\devcon.exe" "$staging\devcon.exe" -Force
              Write-Host "Bundling Microsoft-signed ($env:KIND) driver $env:DRIVER_VERSION ($env:DRIVER_TAG); no test certificate shipped."
          } elseif ($env:FOUND -eq "false") {
              foreach ($name in "StreamToSpeaker.sys", "StreamToSpeaker.inf", "StreamToSpeaker.cat", "StreamToSpeaker.cer", "devcon.exe") {
                  Copy-Item "$dc\$name" "$staging\$name" -Force
              }
              $suffix = "-testsigned"
              Write-Host "##[warning]No Microsoft-signed driver matches this tag's driver source - shipping the TEST-SIGNED driver (users need testsigning mode); the release will be published as a pre-release, not as the latest release. Run an HLK round (Driver certified) or the driver submission + attestation flow (docs/driver-signing.md), then tag again."
              Write-Host "##[warning]Driver reproducibility gate SKIPPED: the bundled test-signed driver is CI's own build of this tag's driver source (the build job or its driver cache); there is no Microsoft-signed package to compare."
          } else {
              throw "the driver lookup gave no answer (found='$env:FOUND')"
          }

          $base = "StreamToSpeakerSetup-$env:VERSION$suffix"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not at $iscc" }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DVersionInfoVersion=$env:VIVERSION" `
            "/F$base" `
            "installer\StreamToSpeaker.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $exe = "installer\out\$base.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "name=$base.exe" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          if ($env:FOUND -eq "true") {
              .github/scripts/Write-DriverRecord.ps1 -StagingDir $staging -OutDir installer\out -Installer "$base.exe" `
                -Kind $env:KIND -SourceHash $env:SOURCE_HASH `
                -Tag $env:DRIVER_TAG -Version $env:DRIVER_VERSION `
                -Build $env:DRIVER_BUILD -Zip $env:DRIVER_ZIP
          } else {
              .github/scripts/Write-DriverRecord.ps1 -StagingDir $staging -OutDir installer\out -Installer "$base.exe" `
                -Kind test-signed -SourceHash $env:SOURCE_HASH
          }
          # The Microsoft-signed driver package is deliberately not a
          # release asset either. It ships inside the installer; publishing
          # the signed .sys as a standalone asset hands anyone a
          # Microsoft-signed virtual audio driver to drop into their own
          # product (see LICENSE-BINARIES.md). The driver-v* prerelease
          # keeps its copy — CI pairs installers to it by source hash, and
          # that release is the audit trail.
          @(
            "## Release packaging"
            ""
            "| | |"
            "| --- | --- |"
            "| Installer | ``$base.exe`` (unsigned, workflow artifact ``unsigned-setup-exe``, sha256 ``$sha``) |"
            "| Driver | $( if ($env:FOUND -eq "true") { "Microsoft-signed ($env:KIND) ``$env:DRIVER_VERSION`` (``$env:DRIVER_TAG``)" } else { "**test-signed fallback** - requires testsigning mode; published as a pre-release, not as the latest release" } ) |"
            "| Reproducibility gate | $( if ($env:FOUND -eq "true") { "verify-driver job" } else { "**skipped** (no Microsoft-signed package to compare)" } ) |"
          ) -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # The unsigned installer travels to the release gate and the signing
      # repo as a workflow artifact of this run, never as a release asset.
      - name: Upload the unsigned installer as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-setup-exe
          path: ${{ steps.iscc.outputs.exe }}
          if-no-files-found: error
          # Read by verify-driver, sign-release and the signing repo once the
          # request is approved: one day, the minimum. The cleanup job
          # deletes it after sign-release, if the installer was signed.
          retention-days: 1
          # A re-run of this job builds and replaces it (new sha256, which
          # the jobs after it follow).
          overwrite: true

  # Release gate: rebuild the driver from the tagged commit the way the
  # driver-v* release `package` picked was built (read from that release's
  # manifest: WHQL-certified lab build or attestation submission build)
  # and check it against that release (source-hash guard, the lab package
  # or submission CAB, the shipped Signed.zip), then unpack the unsigned
  # installer artifact `package` uploaded (exact name and sha256) and check
  # its driver files are that Signed.zip byte for byte with no test
  # certificate. Read-only, no secrets. Called this way the check requires
  # every input below except `commit` to be non-empty (an empty `commit`
  # means the caller's commit) and reports verified / driver_tag /
  # installer_sha256, which sign-release binds to. Skipped only for the
  # test-signed fallback, whose driver is CI's own build of this tag's
  # driver source (the build job, or its cache keyed on the driver source
  # hash); package and sign-release log that loudly.
  verify-driver:
    if: startsWith(github.ref, 'refs/tags/v') && needs.package.outputs.driver_found == 'true'
    needs: package
    permissions:
      contents: read
    uses: ./.github/workflows/driver-reproducibility.yml
    with:
      tag: ${{ needs.package.outputs.driver_tag }}
      commit: ${{ github.sha }}
      installer_artifact: unsigned-setup-exe
      installer_name: ${{ needs.package.outputs.installer_name }}
      installer_sha256: ${{ needs.package.outputs.installer_sha256 }}

  # EV-sign the setup exe `package` built (from its workflow artifact) and
  # put the signed exe on the draft release with its .sha256 sidecar (the
  # canonical download hash), the stable StreamToSpeakerSetup.exe alias and
  # the provenance bundle. Runs only when the release gate verified exactly
  # this driver release and this installer (verified == 'true', and the
  # same driver tag and sha256 `package` reported), or when the gate was
  # skipped because `package` explicitly fell back to the test-signed
  # driver. The signing request carries the sha256 too, so only those bytes
  # can be signed.
  sign-release:
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.package.result == 'success' &&
      ((needs.package.outputs.driver_found == 'true' &&
        needs.verify-driver.result == 'success' &&
        needs.verify-driver.outputs.verified == 'true' &&
        needs.verify-driver.outputs.driver_tag == needs.package.outputs.driver_tag &&
        needs.verify-driver.outputs.installer_sha256 == needs.package.outputs.installer_sha256) ||
       (needs.package.outputs.driver_found == 'false' && needs.verify-driver.result == 'skipped'))
    needs: [package, verify-driver]
    runs-on: windows-latest
    environment: request-signing
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read              # gh run download of the unsigned-exe artifact
      id-token: write            # build-provenance attestation (public repo only)
      attestations: write
    outputs:
      # The signed bytes of this run: publish accepts only this setup exe
      # (and alias) from the draft.
      signed_sha256: ${{ steps.sign.outputs.signed-sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER_NAME: ${{ needs.package.outputs.installer_name }}
      INSTALLER_SHA256: ${{ needs.package.outputs.installer_sha256 }}
      DRIVER_FOUND: ${{ needs.package.outputs.driver_found }}
      PROVENANCE: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check what is about to be signed
        id: asset
        shell: pwsh
        env:
          GATE_DRIVER_TAG: ${{ needs.verify-driver.outputs.driver_tag }}
          GATE_SHA256: ${{ needs.verify-driver.outputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:INSTALLER_NAME
          if ($name -cnotmatch '^StreamToSpeakerSetup-[0-9A-Za-z.+-]+\.exe\z') { throw "package reported no installer name" }
          if ($env:INSTALLER_SHA256 -cnotmatch '^[0-9a-f]{64}\z') { throw "package reported no installer sha256" }
          if ($env:DRIVER_FOUND -ne "true") {
              Write-Host "##[warning]Signing a TEST-SIGNED fallback installer; the driver reproducibility gate was skipped."
          } else {
              Write-Host "Release gate: $env:GATE_DRIVER_TAG verified against $name (sha256 $env:GATE_SHA256)"
          }
          # Before asking for an approval: the draft must still be there,
          # and the tag must still point at this run's commit.
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit (see above)" }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Sign installer via central signing workflow
        id: sign
        uses: ./.github/actions/request-signing
        with:
          source-run-id: ${{ github.run_id }}
          source-artifact: unsigned-setup-exe
          expected-sha256: ${{ needs.package.outputs.installer_sha256 }}
          output-name: ${{ steps.asset.outputs.name }}
          sig-description: "Stream To Speaker Setup"
          token: ${{ secrets.SIGNING_REPO_TOKEN }}

      - name: Upload the signed installer to the draft release
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed-path }}
          SIGNED_SHA256: ${{ steps.sign.outputs.signed-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit to upload to (see above)" }
          "$env:SIGNED_SHA256  $(Split-Path $env:SIGNED -Leaf)" |
              Set-Content -Path "$env:SIGNED.sha256" -Encoding ascii -NoNewline
          gh release upload $env:GITHUB_REF_NAME $env:SIGNED "$env:SIGNED.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          Write-Host "Signed installer on the draft release (sha256 $env:SIGNED_SHA256)"

          # Stable download link. GitHub's /releases/latest/download/<name>
          # redirect needs a FIXED file name, so the release carries an
          # unversioned copy of the same bytes as well — that is the URL the
          # README hands to users. Skipped for -testsigned fallback builds: a
          # permanent link must never resolve to an installer that needs
          # testsigning mode.
          $name = Split-Path $env:SIGNED -Leaf
          if ($name -like "*-testsigned*") {
              Write-Host "##[warning]test-signed build - no stable StreamToSpeakerSetup.exe link on this release"
          } else {
              Copy-Item -LiteralPath $env:SIGNED "StreamToSpeakerSetup.exe" -Force
              "$env:SIGNED_SHA256  StreamToSpeakerSetup.exe" |
                  Set-Content -Path "StreamToSpeakerSetup.exe.sha256" -Encoding ascii -NoNewline
              gh release upload $env:GITHUB_REF_NAME StreamToSpeakerSetup.exe StreamToSpeakerSetup.exe.sha256 --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
              Write-Host "Stable link asset on the draft: releases/latest/download/StreamToSpeakerSetup.exe once published"
          }

      - name: Attest build provenance (public repo only)
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.sign.outputs.signed-path }}

      # Ship the Sigstore bundle beside the binary so anyone can verify
      # offline (gh attestation verify --bundle) without querying GitHub.
      - name: Upload the attestation bundle to the draft release
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed-path }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/release_draft.py require $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "no draft release of this commit to upload to (see above)" }
          $bundle = "$(Split-Path $env:SIGNED -Leaf).sigstore.json"
          Copy-Item -LiteralPath $env:BUNDLE_PATH $bundle
          gh release upload $env:GITHUB_REF_NAME $bundle --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }

      # An earlier attempt that built the other kind of installer (for
      # example -testsigned before a driver release for this source
      # existed) left its setup exe, sidecar and bundle on the draft, and
      # for a -testsigned installer now the alias of a Microsoft-signed one.
      # publish refuses unexpected assets, so they go; nothing else does.
      - name: Remove setup exe assets an earlier attempt left on the draft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pruneArgs = @("prune", $env:GITHUB_REF_NAME, "--repo", $env:GITHUB_REPOSITORY, "--commit", $env:GITHUB_SHA, "--version", $env:GITHUB_REF_NAME.Substring(1), "--installer", $env:INSTALLER_NAME)
          if ($env:PROVENANCE -eq "true") { $pruneArgs += "--provenance" }
          python .github/scripts/release_draft.py @pruneArgs
          if ($LASTEXITCODE -ne 0) { throw "could not remove the assets of an earlier attempt (see above)" }

  # Nothing in the run reads the artifacts with unsigned binaries in them
  # once the exes are signed, so they are deleted rather than left
  # downloadable for the rest of their day. This job runs after
  # sign-release finishes or is skipped (until then they stay
  # downloadable) and deletes unsigned-service-exe if sign-service
  # succeeded, and unsigned-setup-exe, release-inputs and binaries-<ver>
  # if sign-release succeeded. (A failed chain keeps them for re-running
  # its failed jobs; they expire after a day, as does the release gate's
  # comparison artifact, which is not deleted here.)
  cleanup:
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.sign-service.result == 'success'
    needs: [build, sign-service, sign-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write             # delete this run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_SIGNED: ${{ needs.sign-release.result == 'success' }}
    steps:
      - name: Delete the artifacts with unsigned binaries
        shell: bash
        run: |
          set -euo pipefail
          names=(unsigned-service-exe)
          if [ "$RELEASE_SIGNED" = "true" ]; then
            names+=(unsigned-setup-exe release-inputs "binaries-$VERSION")
          fi
          artifacts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            for n in "${names[@]}"; do
              if [ "$name" = "$n" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
                echo "deleted artifact $name ($id)"
              fi
            done
          done <<< "$artifacts"

  # The last job: the draft is published (as the latest release unless a
  # published release other than a pre-release has a version at least as
  # high; a pre-release that is not latest for a test-signed fallback)
  # only when it holds exactly the assets of a complete release
  # (release_draft.py check: every
  # expected name, nothing else, the service exe and the setup exe (and
  # the alias) exactly the bytes sign-service and sign-release signed in
  # this run, each sidecar and provenance bundle matching its file) and
  # every exe on it carries a valid Authenticode signature; publishing
  # then requires the same asset ids that were checked and the tag still
  # pointing at this run's commit. The explicit status checks matter: in
  # the test-signed fallback verify-driver is skipped, and without them
  # that skip would carry through sign-release to this job. If this job
  # alone failed, re-run it.
  publish:
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' && needs.sign-service.result == 'success' &&
      needs.package.result == 'success' && needs.sign-release.result == 'success'
    needs: [build, sign-service, package, sign-release]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      INSTALLER: ${{ needs.package.outputs.installer_name }}
      SERVICE_SHA256: ${{ needs.sign-service.outputs.signed_sha256 }}
      INSTALLER_SHA256: ${{ needs.sign-release.outputs.signed_sha256 }}
      PROVENANCE: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the draft release is complete and signed
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/test_release_draft.py -b
          if ($LASTEXITCODE -ne 0) { throw "release_draft.py unit tests failed" }
          $dir = Join-Path $env:RUNNER_TEMP "draft-assets"
          $checkArgs = @("check", $env:GITHUB_REF_NAME, "--repo", $env:GITHUB_REPOSITORY, "--version", $env:VERSION, "--installer", $env:INSTALLER, "--dir", $dir, "--service-sha256", $env:SERVICE_SHA256, "--installer-sha256", $env:INSTALLER_SHA256)
          if ($env:PROVENANCE -eq "true") { $checkArgs += "--provenance" }
          python .github/scripts/release_draft.py @checkArgs
          if ($LASTEXITCODE -ne 0) { throw "the draft release is not complete (see above); nothing was published" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $exes = @(Get-ChildItem -LiteralPath $dir -Filter *.exe -File)
          if (-not $exes) { throw "no executables downloaded from the draft" }
          foreach ($exe in $exes) {
              & $signtool verify /pa $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "$($exe.Name) on the draft does not carry a valid Authenticode signature; nothing was published" }
          }

      # Latest release unless a published release (other than a pre-release)
      # has a version at least as high; a -testsigned fallback installer
      # makes it a pre-release that is never latest (release_draft.py
      # publish).
      - name: Publish the release
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.check.outputs.release_id }}
          ASSET_IDS: ${{ steps.check.outputs.asset_ids }}
        run: |
          $ErrorActionPreference = "Stop"
          $publishArgs = @("publish", $env:GITHUB_REF_NAME, "--repo", $env:GITHUB_REPOSITORY, "--release-id", $env:RELEASE_ID, "--asset-ids", $env:ASSET_IDS, "--commit", $env:GITHUB_SHA, "--version", $env:VERSION, "--installer", $env:INSTALLER)
          if ($env:PROVENANCE -eq "true") { $publishArgs += "--provenance" }
          python .github/scripts/release_draft.py @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "publishing $env:GITHUB_REF_NAME failed (see above)" }

  # Installer lifecycle test (installer-lifecycle.yml) for pull requests
  # that change what the installer does: install / repair / uninstall /
  # upgrade from the previous release, run against the installer this run
  # just built. Also runs when this workflow changes, since it builds and
  # stages the installer. Other PRs skip it; it can also be dispatched on
  # its own.
  installer-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR merge commit and its first parent (the base it merges
          # into): their diff is exactly the PR's change.
          fetch-depth: 2
      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^(installer/|scripts/(Pre-Install|Rename-Endpoint|Reset-Install|Diagnose)\.ps1$|\.github/workflows/(build|installer-lifecycle)\.yml$|\.github/scripts/(Test-InstallerLifecycle|Write-DriverRecord)\.ps1$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  installer-lifecycle:
    needs: [build, installer-changes]
    if: needs.installer-changes.outputs.changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/installer-lifecycle.yml
    with:
      version: ${{ needs.build.outputs.version }}

  # Minimum-supported-Rust check. `rust-version` in service/Cargo.toml is
  # only a true statement while this job passes: it checks both targets on
  # exactly that toolchain with the lockfile as-is (--locked), so a
  # dependency bump that raises the floor fails here instead of on a user's
  # machine. Ubuntu is enough — the Windows-only code is covered by the
  # cross-check target, the same way the local workflow does it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Checks on the workflow files themselves (test_workflows.py). This
      # job runs in every run of this workflow (every pull request, every
      # push to main), and the checks need only the runner's own Python, so
      # they come right after the checkout.
      - name: Workflow checks (test_workflows.py)
        working-directory: .github/scripts
        run: python3 -m unittest -v test_workflows

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' service/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$v" || { echo "no rust-version in service/Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: service

      - name: cargo check on the MSRV (Linux + Windows cross-check)
        working-directory: service
        run: |
          cargo check --locked
          cargo check --locked --target x86_64-pc-windows-gnu
