name: Driver attest

# Reconciles the newest driver-v* release toward Microsoft attestation via
# the Partner Center Hardware API (runbook: docs/driver-signing.md).
# Idempotent: all state
# lives in the release's manifest.json (ms_product_id / ms_submission_id /
# ms_state), IDs are persisted before any upload, and a re-run always resumes
# from the recorded state — workflow_dispatch is the universal retry. All
# logic lives in .github/scripts/attest.py; this file just runs it and then
# hands the finished release to the verification workflow.
#
# Secrets: AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — the
# Entra app associated with the Partner Center account (docs/
# driver-signing.md, one-time setup), held by the `partner-center`
# environment, whose deployment policy admits branch main alone: a workflow
# edited on any other branch or tag can't read them. Only the reconcile job
# runs in it; the dry run needs no credential and runs from any branch.
# Client secrets expire (≤24 months); the failure mode is invalid_client
# from the token endpoint.
#
# The automatic hand-off from Driver submission is OPT-IN: set the
# repository variable AUTO_ATTEST=true (Settings → Secrets and variables →
# Actions → Variables). Without it the workflow_run trigger logs why it did
# nothing and exits green; workflow_dispatch always runs. Rationale: the
# shipped driver is now the WHQL-certified package, and an attestation
# submission for the same source would be a lower-trust duplicate (the
# certified-guard job in Driver submission already prevents the build;
# this is the second lock in case that guard is bypassed with force=true).

run-name: "Driver attest · ${{ inputs.tag || 'newest driver release' }}"

on:
  workflow_run:
    workflows: ["Driver submission"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "driver-v* release tag (default: newest by build number)"
        required: false
        default: ""
      dry_run:
        description: "Validate the wiring only: no Partner Center call, no release change; hands `tag` to Driver attested in dry-run mode (exercises the reusable-workflow call + its permission grants)"
        type: boolean
        required: false
        default: false

# Read-only by default; reconcile and verify declare what they write.
permissions:
  contents: read

concurrency:
  group: driver-attest
  cancel-in-progress: false

jobs:
  auto-attest-gate:
    # workflow_run only: explain (visibly, in a green run) why nothing
    # happened unless auto-attest is switched on.
    if: github.event_name == 'workflow_run' && vars.AUTO_ATTEST != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::notice::Automatic attestation is OFF (repository variable AUTO_ATTEST != 'true'). Nothing was submitted to Microsoft. To attest the newest driver-v* release, run this workflow manually (Actions → Driver attest → Run workflow), or set AUTO_ATTEST=true to re-enable the hand-off from Driver submission."

  # Wiring check only: no Partner Center call and no credential, so it can
  # run from the branch a workflow change is made on.
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify_tag: ${{ steps.dry.outputs.verify_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Unit tests (guard)
        run: python3 -m unittest discover -s .github/scripts

      - name: Dry run (no Partner Center call)
        id: dry
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-driver-v1.1.0.204}"
          [[ "$tag" =~ ^driver-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be driver-v<version>"; exit 1; }
          echo "::notice::dry run - skipping the Hardware API; handing $tag to Driver attested in dry-run mode"
          echo "verify_tag=$tag" >> "$GITHUB_OUTPUT"

  reconcile:
    # On workflow_run, only act when Driver submission succeeded (its
    # sign-cab job completed → the EV-signed CAB is on the release) AND
    # auto-attest is opted in. A manual dispatch runs unless it is a dry
    # run. The environment admits main only: workflow_run runs from main,
    # and a dispatch must be made from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && vars.AUTO_ATTEST == 'true')
    runs-on: ubuntu-latest
    environment: partner-center
    timeout-minutes: 55
    permissions:
      contents: write            # records the submission state on the release
    outputs:
      verify_tag: ${{ steps.attest.outputs.verify_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Unit tests (guard)
        run: python3 -m unittest discover -s .github/scripts

      - name: Reconcile attestation state
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/attest.py

  verify:
    needs: [dry-run, reconcile]
    # One of the two ran (the other is skipped); neither may have failed.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.reconcile.outputs.verify_tag != '' || needs.dry-run.outputs.verify_tag != '')
    uses: ./.github/workflows/driver-attested.yml
    # A caller must grant every permission the reusable workflow declares
    # (driver-attested.yml requests id-token + attestations for the
    # build-provenance step), or GitHub rejects the workflow at push time.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.reconcile.outputs.verify_tag || needs.dry-run.outputs.verify_tag }}
      dry_run: ${{ needs.dry-run.result == 'success' }}
