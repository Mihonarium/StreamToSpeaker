name: Driver attested

# Second half of the driver production-signing pipeline (first half:
# driver-submission.yml; runbook: docs/driver-signing.md).
#
# Attestation only — a WHQL/HLK return goes through driver-certified.yml
# (its .sys keeps the lab test signature as the primary signer, which the
# checks below reject by design).
#
# Run this manually after Microsoft returns the attestation-signed driver:
# download the signed zip from the Partner Center hardware dashboard, attach
# it (a .zip named with letters, digits and . _ + -) to the matching
# driver-v* prerelease, then trigger this workflow. It:
#   1. verifies Microsoft's signatures (signtool /kp against the catalog AND
#      the embedded .sys signature; the signer chain must be the
#      "Microsoft Windows Hardware Compatibility Publisher");
#   2. checks the INF is byte-identical to the one in our submission CAB
#      (attestation leaves the INF untouched — any difference means the zip
#      doesn't belong to this submission);
#   3. checks the INF DriverVer matches the release version, and that the
#      returned .sys is the submitted one (identical after stripping
#      signatures, certified.py sys-match);
#   4. repackages inf/sys/cat (+pdb from the CAB) into the canonical
#      StreamToSpeaker-Driver-<ver>-Signed.zip, attests its provenance, puts
#      it on the release and then, last, flips the manifest to
#      attested=true — from then on build.yml bundles this driver into
#      installers whenever the driver source hash still matches.
#
# The release is read and written through .github/scripts/driver_release.py:
# only an unfinished attestation round (an EV-signed CAB recorded, not yet
# attested or certified) is written, the CAB compared against is the one
# whose SHA-256 the manifest records, and nothing on the release is deleted
# before its replacement is up.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "driver-v* release tag carrying the Microsoft-signed zip (default: the newest unfinished one with a zip attached)"
        required: false
        default: ""
      dry_run:
        description: "Verify only (signatures + INF checks against the given tag, which may already be attested); never touch the release"
        type: boolean
        required: false
        default: false
  # Called by driver-attest.yml right after it attaches the zip Microsoft
  # returned; identical checks run on both the automatic and manual paths.
  # NB a caller must grant contents: write + id-token: write +
  # attestations: write, or GitHub refuses the call at trigger time.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write            # build-provenance attestation (public repo only)
  attestations: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only the comparison scripts, in their own directory: the steps
      # below work in the workspace root (assets/, ms-signed/, ...), and a
      # full checkout would mix the repository's own assets/ into them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo-scripts
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve release + download assets
        id: rel
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $fetchArgs = @("attested-fetch", "--dir", "assets")
          if ($env:INPUT_TAG) { $fetchArgs += @("--tag", $env:INPUT_TAG) }
          if ($env:DRY_RUN -eq "true") { $fetchArgs += "--dry-run" }
          python repo-scripts\.github\scripts\driver_release.py @fetchArgs
          if ($LASTEXITCODE -ne 0) { throw "no release to verify (see above)" }

      - name: Verify Microsoft signatures + INF integrity
        id: verify
        shell: pwsh
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          MS_ZIP: ${{ steps.rel.outputs.ms_zip }}
          CAB: ${{ steps.rel.outputs.cab }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION

          # --- extract Microsoft's zip --------------------------------
          Expand-Archive $env:MS_ZIP -DestinationPath ms-signed -Force
          $sysFiles = @(Get-ChildItem ms-signed -Recurse -Filter "StreamToSpeaker.sys")
          if ($sysFiles.Count -eq 0) { throw "zip contains no StreamToSpeaker.sys" }
          if (($sysFiles | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash } | Select-Object -Unique).Count -gt 1) {
              throw "zip contains multiple DIFFERENT StreamToSpeaker.sys files - inspect it manually"
          }
          $sys = $sysFiles[0]
          $dir = $sys.DirectoryName
          $inf = Join-Path $dir "StreamToSpeaker.inf"
          $cat = Join-Path $dir "StreamToSpeaker.cat"
          foreach ($f in $inf, $cat) { if (-not (Test-Path $f)) { throw "expected $f next to the signed .sys" } }

          # --- extract our submission CAB for comparison --------------
          # (The EV signature on the CAB container doesn't change the
          # files inside, so extraction works on the signed CAB.)
          New-Item -ItemType Directory -Force -Path cab-contents | Out-Null
          expand.exe -F:* $env:CAB cab-contents | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "expand.exe failed on the submission CAB" }
          $subInf = Get-ChildItem cab-contents -Recurse -Filter "StreamToSpeaker.inf" | Select-Object -First 1
          if (-not $subInf) { throw "submission CAB contains no INF?" }

          # --- signature checks ----------------------------------------
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName

          Write-Host "== catalog verification (kernel policy) =="
          $catOut = & $signtool verify /kp /v /c $cat $sys.FullName 2>&1 | Out-String
          Write-Host $catOut
          if ($LASTEXITCODE -ne 0) { throw "signtool catalog verification failed" }

          Write-Host "== embedded verification (kernel policy) =="
          $embOut = & $signtool verify /kp /v $sys.FullName 2>&1 | Out-String
          Write-Host $embOut
          if ($LASTEXITCODE -ne 0) { throw "signtool embedded verification failed" }

          if (($catOut + $embOut) -notmatch "Hardware Compatibility Publisher") {
              throw "signer is not the Microsoft Windows Hardware Compatibility Publisher - this doesn't look like an attestation-signed package"
          }

          # --- INF identity checks -------------------------------------
          $a = (Get-FileHash $inf -Algorithm SHA256).Hash
          $b = (Get-FileHash $subInf.FullName -Algorithm SHA256).Hash
          if ($a -ne $b) {
              throw "returned INF differs from the submitted INF - this zip doesn't match this submission (or the INF was modified)"
          }
          python repo-scripts\.github\scripts\repro_compare.py driverver $inf $version
          if ($LASTEXITCODE -ne 0) { throw "returned INF does not carry DriverVer $version" }

          # --- .sys identity check -------------------------------------
          # Attestation only adds Microsoft's signature; the code must be
          # exactly the unsigned binary we submitted.
          $subSys = @(Get-ChildItem cab-contents -Recurse -Filter "StreamToSpeaker.sys")
          if ($subSys.Count -ne 1) { throw "expected exactly one StreamToSpeaker.sys in the submission CAB, found $($subSys.Count)" }
          $subSysPath = $subSys[0].FullName
          python repo-scripts\.github\scripts\certified.py sys-match --signed $sys.FullName --submitted $subSysPath
          if ($LASTEXITCODE -ne 0) { throw "returned .sys differs from the submitted .sys" }

          # --- canonical repackage -------------------------------------
          New-Item -ItemType Directory -Force -Path signed-driver | Out-Null
          Copy-Item $inf, $cat, $sys.FullName signed-driver\
          $pdb = Get-ChildItem cab-contents -Recurse -Filter "StreamToSpeaker.pdb" | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName signed-driver\ }
          $zipName = "StreamToSpeaker-Driver-$version-Signed.zip"
          Compress-Archive -Path signed-driver\* -DestinationPath $zipName -Force
          $zipSha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_sha256=$zipSha" >> $env:GITHUB_OUTPUT

      - name: Dry run - verification passed, release untouched
        if: inputs.dry_run
        shell: pwsh
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          Write-Host "::notice::dry run - $env:TAG verified (signtool + INF and .sys identity); manifest and release notes left as they are"
          "## Driver attested - dry run of ``$env:TAG`` passed (release untouched)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # Provenance for the canonical driver package (bytes are final here),
      # before it is published. Skipped if the repository is ever made
      # private: attestations on private repositories need GitHub
      # Enterprise Cloud. Verify with:
      #   gh attestation verify StreamToSpeaker-Driver-<ver>-Signed.zip -R Mihonarium/StreamToSpeaker
      - name: Attest build provenance (public repo only)
        id: attest
        if: ${{ !github.event.repository.private && !inputs.dry_run }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.verify.outputs.zip_name }}

      # The Signed.zip, its .sha256 and the provenance bundle go up first,
      # the notes are rewritten, and manifest.json (attested=true) comes
      # last: a run that stops half way leaves an unfinished round that a
      # re-run completes.
      - name: Finalize release (manifest attested=true)
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          MS_ZIP_NAME: ${{ steps.rel.outputs.ms_zip_name }}
          ZIP_NAME: ${{ steps.verify.outputs.zip_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $recordArgs = @("attested-record", "--tag", $env:TAG, "--signed-zip", $env:ZIP_NAME, "--ms-zip-name", $env:MS_ZIP_NAME)
          if ($env:BUNDLE_PATH) { $recordArgs += @("--bundle", $env:BUNDLE_PATH) }
          python repo-scripts\.github\scripts\driver_release.py @recordArgs
          if ($LASTEXITCODE -ne 0) { throw "could not mark $env:TAG attested (see above)" }
