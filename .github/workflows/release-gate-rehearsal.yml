# Temporary: rehearses build.yml's release chain from a branch without
# signing or publishing anything.
#   gate chains - a stand-in `package` (driver picked by the real
#     Get-AttestedDriver.ps1 from a tagged source, a published installer
#     uploaded as the unsigned-installer artifact), the verify-driver call
#     as in build.yml, and a stand-in sign-release with build.yml's
#     condition that only fetches and hash-checks the artifact:
#       certified (v0.1.9), attested (v0.1.6) - must pass;
#       installer-mismatch (v0.1.6 installer vs v0.1.9's driver),
#       source-mismatch (driver-v1.1.0.209 against v0.1.10's tree),
#       empty-input (gate called without an installer artifact) - must fail
#       and leave the stand-in skipped;
#       fallback (no matching driver) - gate skipped, stand-in runs.
#   driver-lookup - Get-AttestedDriver.ps1 strict / -WarnOnError on errors.
#   draft-release - a draft for a tag that does not exist, gh by tag,
#     release_draft.py ensure/require/check (+ negatives), signature check,
#     what an unauthenticated client sees, then the draft is deleted. The
#     draft is never published.
#   rerun-upload / rerun-use - artifacts across re-run attempts.
name: Release gate rehearsal

on:
  push:
    branches: [ci/release-driver-gate-v2]
    paths: [".github/workflows/release-gate-rehearsal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-certified:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.src.outputs.commit }}
      driver_found: ${{ steps.attested.outputs.found }}
      driver_tag: ${{ steps.attested.outputs.tag }}
      installer_name: ${{ steps.inst.outputs.name }}
      installer_sha256: ${{ steps.inst.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: v0.1.9, path: tagged }
      - uses: actions/checkout@v4
        with: { path: tools, sparse-checkout: .github/scripts }
      - id: src
        working-directory: tagged
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: attested
        shell: pwsh
        run: tools/.github/scripts/Get-AttestedDriver.ps1 -SourceHash "${{ hashFiles('tagged/driver/**', 'tagged/include/**') }}" -OutDir attested-driver
      - id: inst
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "StreamToSpeakerSetup-0.1.9.exe"
          gh release download v0.1.9 --repo $env:GITHUB_REPOSITORY --pattern $name --dir inst
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash "inst/$name" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-exe-certified
          path: inst/StreamToSpeakerSetup-0.1.9.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-driver-certified:
    if: needs.package-certified.outputs.driver_found == 'true'
    needs: package-certified
    permissions:
      contents: read
    uses: ./.github/workflows/driver-reproducibility.yml
    with:
      tag: ${{ needs.package-certified.outputs.driver_tag }}
      commit: ${{ needs.package-certified.outputs.commit }}
      installer_artifact: unsigned-setup-exe-certified
      installer_name: ${{ needs.package-certified.outputs.installer_name }}
      installer_sha256: ${{ needs.package-certified.outputs.installer_sha256 }}

  sign-release-certified:
    if: >-
      !cancelled() &&
      needs.package-certified.result == 'success' &&
      ((needs.package-certified.outputs.driver_found == 'true' &&
        needs.verify-driver-certified.result == 'success' &&
        needs.verify-driver-certified.outputs.verified == 'true' &&
        needs.verify-driver-certified.outputs.driver_tag == needs.package-certified.outputs.driver_tag &&
        needs.verify-driver-certified.outputs.installer_sha256 == needs.package-certified.outputs.installer_sha256) ||
       (needs.package-certified.outputs.driver_found == 'false' && needs.verify-driver-certified.result == 'skipped'))
    needs: [package-certified, verify-driver-certified]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-setup-exe-certified
          path: setup-unsigned
      - shell: pwsh
        run: |
          $name = "${{ needs.package-certified.outputs.installer_name }}"
          $sha = (Get-FileHash "setup-unsigned/$name" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "${{ needs.package-certified.outputs.installer_sha256 }}") { throw "hash differs" }
          Write-Host "sign-release would sign: $name sha256 $sha (gate ${{ needs.verify-driver-certified.result }}, verified '${{ needs.verify-driver-certified.outputs.verified }}', ${{ needs.verify-driver-certified.outputs.driver_tag }})"

  publish-certified:
    if: >-
      !cancelled() &&
      needs.package-certified.result == 'success' &&
      needs.sign-release-certified.result == 'success'
    needs: [package-certified, sign-release-certified]
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish would run after sign-release (certified)"

  package-attested:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.src.outputs.commit }}
      driver_found: ${{ steps.attested.outputs.found }}
      driver_tag: ${{ steps.attested.outputs.tag }}
      installer_name: ${{ steps.inst.outputs.name }}
      installer_sha256: ${{ steps.inst.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: v0.1.6, path: tagged }
      - uses: actions/checkout@v4
        with: { path: tools, sparse-checkout: .github/scripts }
      - id: src
        working-directory: tagged
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: attested
        shell: pwsh
        run: tools/.github/scripts/Get-AttestedDriver.ps1 -SourceHash "${{ hashFiles('tagged/driver/**', 'tagged/include/**') }}" -OutDir attested-driver
      - id: inst
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "StreamToSpeakerSetup-0.1.6.exe"
          gh release download v0.1.6 --repo $env:GITHUB_REPOSITORY --pattern $name --dir inst
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash "inst/$name" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-exe-attested
          path: inst/StreamToSpeakerSetup-0.1.6.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-driver-attested:
    if: needs.package-attested.outputs.driver_found == 'true'
    needs: package-attested
    permissions:
      contents: read
    uses: ./.github/workflows/driver-reproducibility.yml
    with:
      tag: ${{ needs.package-attested.outputs.driver_tag }}
      commit: ${{ needs.package-attested.outputs.commit }}
      installer_artifact: unsigned-setup-exe-attested
      installer_name: ${{ needs.package-attested.outputs.installer_name }}
      installer_sha256: ${{ needs.package-attested.outputs.installer_sha256 }}

  sign-release-attested:
    if: >-
      !cancelled() &&
      needs.package-attested.result == 'success' &&
      ((needs.package-attested.outputs.driver_found == 'true' &&
        needs.verify-driver-attested.result == 'success' &&
        needs.verify-driver-attested.outputs.verified == 'true' &&
        needs.verify-driver-attested.outputs.driver_tag == needs.package-attested.outputs.driver_tag &&
        needs.verify-driver-attested.outputs.installer_sha256 == needs.package-attested.outputs.installer_sha256) ||
       (needs.package-attested.outputs.driver_found == 'false' && needs.verify-driver-attested.result == 'skipped'))
    needs: [package-attested, verify-driver-attested]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-setup-exe-attested
          path: setup-unsigned
      - shell: pwsh
        run: |
          $name = "${{ needs.package-attested.outputs.installer_name }}"
          $sha = (Get-FileHash "setup-unsigned/$name" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "${{ needs.package-attested.outputs.installer_sha256 }}") { throw "hash differs" }
          Write-Host "sign-release would sign: $name sha256 $sha (gate ${{ needs.verify-driver-attested.result }}, verified '${{ needs.verify-driver-attested.outputs.verified }}', ${{ needs.verify-driver-attested.outputs.driver_tag }})"

  publish-attested:
    if: >-
      !cancelled() &&
      needs.package-attested.result == 'success' &&
      needs.sign-release-attested.result == 'success'
    needs: [package-attested, sign-release-attested]
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish would run after sign-release (attested)"

  package-installer-mismatch:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.src.outputs.commit }}
      driver_found: ${{ steps.attested.outputs.found }}
      driver_tag: ${{ steps.attested.outputs.tag }}
      installer_name: ${{ steps.inst.outputs.name }}
      installer_sha256: ${{ steps.inst.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: v0.1.9, path: tagged }
      - uses: actions/checkout@v4
        with: { path: tools, sparse-checkout: .github/scripts }
      - id: src
        working-directory: tagged
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: attested
        shell: pwsh
        run: tools/.github/scripts/Get-AttestedDriver.ps1 -SourceHash "${{ hashFiles('tagged/driver/**', 'tagged/include/**') }}" -OutDir attested-driver
      - id: inst
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "StreamToSpeakerSetup-0.1.6.exe"
          gh release download v0.1.6 --repo $env:GITHUB_REPOSITORY --pattern $name --dir inst
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash "inst/$name" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-exe-installer-mismatch
          path: inst/StreamToSpeakerSetup-0.1.6.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-driver-installer-mismatch:
    if: needs.package-installer-mismatch.outputs.driver_found == 'true'
    needs: package-installer-mismatch
    permissions:
      contents: read
    uses: ./.github/workflows/driver-reproducibility.yml
    with:
      tag: ${{ needs.package-installer-mismatch.outputs.driver_tag }}
      commit: ${{ needs.package-installer-mismatch.outputs.commit }}
      installer_artifact: unsigned-setup-exe-installer-mismatch
      installer_name: ${{ needs.package-installer-mismatch.outputs.installer_name }}
      installer_sha256: ${{ needs.package-installer-mismatch.outputs.installer_sha256 }}

  sign-release-installer-mismatch:
    if: >-
      !cancelled() &&
      needs.package-installer-mismatch.result == 'success' &&
      ((needs.package-installer-mismatch.outputs.driver_found == 'true' &&
        needs.verify-driver-installer-mismatch.result == 'success' &&
        needs.verify-driver-installer-mismatch.outputs.verified == 'true' &&
        needs.verify-driver-installer-mismatch.outputs.driver_tag == needs.package-installer-mismatch.outputs.driver_tag &&
        needs.verify-driver-installer-mismatch.outputs.installer_sha256 == needs.package-installer-mismatch.outputs.installer_sha256) ||
       (needs.package-installer-mismatch.outputs.driver_found == 'false' && needs.verify-driver-installer-mismatch.result == 'skipped'))
    needs: [package-installer-mismatch, verify-driver-installer-mismatch]
    runs-on: ubuntu-latest
    steps:
