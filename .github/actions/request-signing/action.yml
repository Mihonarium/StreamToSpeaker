name: Request EV code signature
description: >
  Dispatch the central signing workflow (Mihonarium/signing, sign.yml), wait
  for the human approval gate there and for the run to finish, download the
  "signed" artifact, verify it locally with signtool, and expose the signed
  file's path + hash. The approval in the signing repo authorizes exactly
  the SHA-256 this action computes from the source bytes, so nothing can be
  swapped between dispatch and signature. Two source modes:
    - artifact-url: a URL fetchable WITHOUT authentication (public repos /
      presigned URLs only — a private repo's release URLs serve a 404 page).
    - source-run-id + source-artifact: an Actions artifact of a run in THIS
      repository; the signing workflow fetches it post-approval with its
      FETCH_TOKEN environment secret (fine-grained PAT, Actions: Read-only
      on this repo). This is the mode that works from a private repo.
  Windows runners only (pwsh + signtool from the preinstalled Windows SDK).
  The calling job must run in the `request-signing` environment so it can
  read the SIGNING_REPO_TOKEN secret.

inputs:
  artifact-url:
    description: >
      Source mode A: public (unauthenticated) URL of the exact bytes to
      sign. The signing workflow fetches this itself, so it must stay
      reachable until the human approves. Mutually exclusive with
      source-run-id/source-artifact.
    required: false
    default: ""
  source-run-id:
    description: >
      Source mode B (private repos): numeric Actions run ID in this
      repository whose artifact holds the unsigned file (use github.run_id
      to sign an artifact uploaded earlier in the same run). Requires
      source-artifact; mutually exclusive with artifact-url.
    required: false
    default: ""
  source-artifact:
    description: "Source mode B: name of the Actions artifact (must contain exactly one file)"
    required: false
    default: ""
  repo-token:
    description: >
      Token used to download the source artifact from this repository for
      pre-dispatch hashing (mode B only). The default workflow token is
      sufficient.
    required: false
    default: ${{ github.token }}
  output-name:
    description: >
      File name for the signed output (must satisfy the signing workflow's
      strict name pattern; the extension selects the signing format there —
      .exe/.sys via ssign, .cab/.cat/.msi via osslsigncode + PKCS#11).
    required: true
  sig-description:
    description: Authenticode description embedded in the signature.
    required: true
  sig-url:
    description: Authenticode URL embedded in the signature.
    required: false
    default: https://github.com/Mihonarium/StreamToSpeaker
  expected-sha256:
    description: >
      Optional cross-check — fail before dispatching if the bytes at
      artifact-url don't hash to this (catches a release asset modified
      between upload and dispatch). Case-insensitive hex.
    required: false
    default: ""
  signing-repo:
    description: owner/repo of the central signing repository.
    required: false
    default: Mihonarium/signing
  signing-workflow:
    description: Workflow file name in the signing repository.
    required: false
    default: sign.yml
  signing-ref:
    description: Ref of the signing repository to dispatch on.
    required: false
    default: main
  token:
    description: >
      Fine-grained PAT with Actions Read+Write scoped to the signing repo
      only (the SIGNING_REPO_TOKEN secret in the request-signing
      environment).
    required: true
  wait-minutes:
    description: >
      How long to wait for the human approval + run completion before
      giving up. On timeout, approve the signing run and re-run the job.
    required: false
    default: "60"

outputs:
  signed-path:
    description: Absolute path of the verified signed file on the runner.
    value: ${{ steps.sign.outputs.signed-path }}
  signed-sha256:
    description: Lowercase SHA-256 of the signed file.
    value: ${{ steps.sign.outputs.signed-sha256 }}
  unsigned-sha256:
    description: Lowercase SHA-256 of the input bytes (what the approval authorized).
    value: ${{ steps.sign.outputs.unsigned-sha256 }}

runs:
  using: composite
  steps:
    - id: sign
      shell: pwsh
      env:
        REQSIGN_URL: ${{ inputs.artifact-url }}
        REQSIGN_SRC_RUN: ${{ inputs.source-run-id }}
        REQSIGN_SRC_ART: ${{ inputs.source-artifact }}
        REQSIGN_REPO_TOKEN: ${{ inputs.repo-token }}
        REQSIGN_OUTPUT_NAME: ${{ inputs.output-name }}
        REQSIGN_SIG_DESCRIPTION: ${{ inputs.sig-description }}
        REQSIGN_SIG_URL: ${{ inputs.sig-url }}
        REQSIGN_EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        REQSIGN_REPO: ${{ inputs.signing-repo }}
        REQSIGN_WORKFLOW: ${{ inputs.signing-workflow }}
        REQSIGN_REF: ${{ inputs.signing-ref }}
        REQSIGN_TOKEN: ${{ inputs.token }}
        REQSIGN_WAIT_MINUTES: ${{ inputs.wait-minutes }}
      run: |
        $ErrorActionPreference = "Stop"
        if (-not $env:REQSIGN_TOKEN) {
            throw "signing token is empty - is the SIGNING_REPO_TOKEN secret set, and does the job run in the request-signing environment?"
        }
        $hdr = @{ Authorization = "Bearer $env:REQSIGN_TOKEN"; Accept = "application/vnd.github+json" }
        $work = Join-Path $env:RUNNER_TEMP ("reqsign-" + [guid]::NewGuid().ToString("N"))
        New-Item -ItemType Directory -Path $work | Out-Null

        # Hash the actual bytes the signing workflow will fetch, not a local
        # copy — the approval over there binds to this digest.
        $unsigned = Join-Path $work "unsigned.bin"
        if ($env:REQSIGN_SRC_RUN) {
            if ($env:REQSIGN_URL) { throw "give either artifact-url or source-run-id/source-artifact, not both" }
            if (-not $env:REQSIGN_SRC_ART) { throw "source-artifact is required with source-run-id" }
            if ($env:REQSIGN_SRC_RUN -notmatch '^\d+$') { throw "source-run-id must be numeric" }
            $fetchDir = Join-Path $work "src-artifact"
            $env:GH_TOKEN = $env:REQSIGN_REPO_TOKEN
            gh run download $env:REQSIGN_SRC_RUN --repo $env:GITHUB_REPOSITORY `
                --name $env:REQSIGN_SRC_ART --dir $fetchDir
            if ($LASTEXITCODE -ne 0) { throw "gh run download failed for artifact '$($env:REQSIGN_SRC_ART)' of run $($env:REQSIGN_SRC_RUN)" }
            $files = @(Get-ChildItem $fetchDir -Recurse -File)
            if ($files.Count -ne 1) { throw "artifact '$($env:REQSIGN_SRC_ART)' must contain exactly one file, found $($files.Count)" }
            Copy-Item $files[0].FullName $unsigned
        } else {
            if (-not $env:REQSIGN_URL) { throw "no source: set artifact-url, or source-run-id + source-artifact" }
            Invoke-WebRequest -Uri $env:REQSIGN_URL -OutFile $unsigned
        }
        $sha = (Get-FileHash $unsigned -Algorithm SHA256).Hash.ToLower()
        if ($env:REQSIGN_EXPECTED_SHA256 -and $env:REQSIGN_EXPECTED_SHA256.ToLower() -ne $sha) {
            throw "bytes at $env:REQSIGN_URL hash to $sha, expected $($env:REQSIGN_EXPECTED_SHA256.ToLower()) - refusing to request a signature for unexpected content"
        }
        "unsigned-sha256=$sha" >> $env:GITHUB_OUTPUT

        # --- dispatch the signing workflow ---------------------------------
        $dispatchInputs = @{
            sha256          = $sha
            output_name     = $env:REQSIGN_OUTPUT_NAME
            sig_description = $env:REQSIGN_SIG_DESCRIPTION
            sig_url         = $env:REQSIGN_SIG_URL
        }
        if ($env:REQSIGN_SRC_RUN) {
            # Private-source mode: the signing workflow fetches the artifact
            # post-approval with its FETCH_TOKEN environment secret.
            $dispatchInputs.source_repo     = $env:GITHUB_REPOSITORY
            $dispatchInputs.source_run_id   = $env:REQSIGN_SRC_RUN
            $dispatchInputs.source_artifact = $env:REQSIGN_SRC_ART
        } else {
            $dispatchInputs.artifact_url = $env:REQSIGN_URL
        }
        $body = @{
            ref = $env:REQSIGN_REF
            inputs = $dispatchInputs
        } | ConvertTo-Json
        Invoke-RestMethod -Method Post -Headers $hdr -Body $body -Uri `
            "https://api.github.com/repos/$($env:REQSIGN_REPO)/actions/workflows/$($env:REQSIGN_WORKFLOW)/dispatches"
        Write-Host "Dispatched signing of $($env:REQSIGN_OUTPUT_NAME) (sha256 $sha)"

        # --- find our run (the run name embeds the sha256) -----------------
        $run = $null
        foreach ($i in 1..30) {
            Start-Sleep -Seconds 10
            $runs = (Invoke-RestMethod -Headers $hdr -Uri `
                "https://api.github.com/repos/$($env:REQSIGN_REPO)/actions/workflows/$($env:REQSIGN_WORKFLOW)/runs?event=workflow_dispatch&per_page=10").workflow_runs
            $run = $runs | Where-Object { $_.display_title -match $sha } | Select-Object -First 1
            if ($run) { break }
        }
        if (-not $run) { throw "signing run did not appear within 5 minutes" }
        Write-Host "Signing run: $($run.html_url)"
        Write-Host "##[notice]Waiting for approval on the signing run - verify its run name shows sha256 $sha, then approve."

        # --- wait for approval + completion --------------------------------
        $deadline = (Get-Date).AddMinutes([int]$env:REQSIGN_WAIT_MINUTES)
        while ($true) {
            Start-Sleep -Seconds 20
            $run = Invoke-RestMethod -Headers $hdr -Uri `
                "https://api.github.com/repos/$($env:REQSIGN_REPO)/actions/runs/$($run.id)"
            if ($run.status -eq "completed") { break }
            if ((Get-Date) -gt $deadline) { throw "timed out after $($env:REQSIGN_WAIT_MINUTES) min waiting for the signing run ($($run.status)) - approve it and re-run this job" }
        }
        if ($run.conclusion -ne "success") { throw "signing run concluded '$($run.conclusion)' - see $($run.html_url)" }

        # --- fetch the signed artifact -------------------------------------
        $arts = (Invoke-RestMethod -Headers $hdr -Uri `
            "https://api.github.com/repos/$($env:REQSIGN_REPO)/actions/runs/$($run.id)/artifacts").artifacts
        $signedArt = $arts | Where-Object { $_.name -eq "signed" } | Select-Object -First 1
        if (-not $signedArt) { throw "run has no 'signed' artifact" }
        Invoke-WebRequest -Uri $signedArt.archive_download_url -Headers $hdr -OutFile (Join-Path $work "signed.zip")
        Expand-Archive (Join-Path $work "signed.zip") -DestinationPath (Join-Path $work "signed")
        $signed = Get-ChildItem (Join-Path $work "signed") -Filter $env:REQSIGN_OUTPUT_NAME | Select-Object -First 1
        if (-not $signed) { throw "signed artifact does not contain $($env:REQSIGN_OUTPUT_NAME)" }

        # --- independent local verification --------------------------------
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        & $signtool verify /pa $signed.FullName
        if ($LASTEXITCODE -ne 0) { throw "signtool verification of the signed file failed" }

        # --- provenance: signed output must be OUR input + a signature -----
        # signtool verify only proves the file carries *a* valid signature;
        # a compromised signer could return any validly-signed file. This
        # block proves the content is the approved input.
        #   PE: strip the signature and byte-compare against the submitted
        #   input, masking only what signing legitimately rewrites — the
        #   4-byte PE checksum and the 8-byte security data-directory entry
        #   (PE32 at peHdr+152, PE32+ at peHdr+168; offsets validated
        #   against a real signed x64 binary) — and tolerating up to 7
        #   trailing zero bytes of pre-certificate 8-byte alignment padding.
        #   CAB: the signature is appended to the container, so extract both
        #   CABs and require identical file sets with identical hashes.
        $ext = [IO.Path]::GetExtension($env:REQSIGN_OUTPUT_NAME).ToLower()
        if ($ext -in ".exe", ".dll", ".sys", ".ocx", ".cpl") {
            $stripped = Join-Path $work "stripped.bin"
            Copy-Item $signed.FullName $stripped
            & $signtool remove /s $stripped
            if ($LASTEXITCODE -ne 0) { throw "signtool remove failed - cannot verify signed-output provenance" }
            [byte[]]$u = [IO.File]::ReadAllBytes($unsigned)
            [byte[]]$s = [IO.File]::ReadAllBytes($stripped)
            if ($s.Length -lt $u.Length -or $s.Length -gt $u.Length + 7) {
                throw "stripped signed file length $($s.Length) vs submitted $($u.Length) - content mismatch"
            }
            for ($i = $u.Length; $i -lt $s.Length; $i++) {
                if ($s[$i] -ne 0) { throw "non-zero trailing bytes after signature strip - content mismatch" }
            }
            $peOff = [BitConverter]::ToInt32($u, 0x3C)
            $magic = [BitConverter]::ToUInt16($u, $peOff + 24)
            $ckOff = $peOff + 88
            $secOff = $peOff + 24 + $(if ($magic -eq 0x20B) { 112 } else { 96 }) + 32
            foreach ($arr in @(,$u; ,$s)) {
                for ($i = 0; $i -lt 4; $i++) { $arr[$ckOff + $i] = 0 }
                for ($i = 0; $i -lt 8; $i++) { $arr[$secOff + $i] = 0 }
            }
            $alg = [Security.Cryptography.SHA256]::Create()
            $hu = [BitConverter]::ToString($alg.ComputeHash($u, 0, $u.Length))
            $hs = [BitConverter]::ToString($alg.ComputeHash($s, 0, $u.Length))
            if ($hu -ne $hs) { throw "signed output content differs from the submitted input beyond the signature - refusing" }
            Write-Host "Provenance verified: signed PE = submitted input + signature"
        }
        elseif ($ext -eq ".cab") {
            $du = Join-Path $work "prov-unsigned"; $ds = Join-Path $work "prov-signed"
            New-Item -ItemType Directory -Path $du, $ds | Out-Null
            expand.exe -F:* $unsigned $du | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "expand failed on the submitted CAB" }
            expand.exe -F:* $signed.FullName $ds | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "expand failed on the signed CAB" }
            $inv = { param($root)
                Get-ChildItem $root -Recurse -File | ForEach-Object {
                    "{0}|{1}" -f $_.FullName.Substring($root.Length).ToLower(),
                                 (Get-FileHash $_.FullName -Algorithm SHA256).Hash
                } | Sort-Object
            }
            $lu = @(& $inv $du); $ls = @(& $inv $ds)
            if ($lu.Count -eq 0) { throw "submitted CAB extracted to zero files" }
            if (($lu -join "`n") -ne ($ls -join "`n")) {
                throw "signed CAB contents differ from the submitted CAB - refusing"
            }
            Write-Host "Provenance verified: signed CAB contains exactly the submitted files ($($lu.Count))"
        }
        else {
            Write-Host "##[warning]no provenance check implemented for '$ext' - signature validity verified only"
        }

        $signedSha = (Get-FileHash $signed.FullName -Algorithm SHA256).Hash.ToLower()
        if ($signedSha -eq $sha) { throw "signed file is byte-identical to the unsigned input" }

        "signed-path=$($signed.FullName)" >> $env:GITHUB_OUTPUT
        "signed-sha256=$signedSha" >> $env:GITHUB_OUTPUT
        Write-Host "Signed $($env:REQSIGN_OUTPUT_NAME): sha256 $signedSha"
